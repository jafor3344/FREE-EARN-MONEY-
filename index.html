<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Juice Glass Runner 3D</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        .hud-glass {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }
    </style>
</head>
<body>

    <!-- Canvas Container -->
    <div id="canvas-container"></div>

    <!-- UI Overlay (Top Corner Level & Score as requested) -->
    <div class="absolute top-4 left-4 right-4 flex justify-between items-center pointer-events-none z-10">
        <!-- Level & Progress Header -->
        <div class="hud-glass px-4 py-2 rounded-2xl flex items-center space-x-3 pointer-events-auto">
            <div id="level-badge" class="bg-amber-500 text-white font-black px-3 py-1 rounded-xl text-sm shadow">LVL 1</div>
            <div class="flex items-center space-x-2">
                <div class="w-28 bg-gray-200 h-3 rounded-full overflow-hidden border border-white">
                    <div id="progress-bar" class="bg-gradient-to-r from-emerald-400 to-green-500 h-full w-0 transition-all duration-300"></div>
                </div>
                <span class="text-xs font-bold text-gray-700">🏁</span>
            </div>
        </div>

        <!-- Score & Color Match Card -->
        <div class="flex space-x-2 pointer-events-auto">
            <div class="hud-glass px-3 py-2 rounded-2xl flex items-center space-x-2">
                <div id="color-indicator" class="w-4 h-4 rounded-full bg-emerald-500 border border-white shadow"></div>
                <div class="text-right">
                    <div class="text-[9px] font-bold text-gray-400 uppercase tracking-wider">Current Match</div>
                    <div id="color-text" class="text-xs font-extrabold text-emerald-600">Green Juice</div>
                </div>
            </div>
            <div class="hud-glass px-4 py-2 rounded-2xl text-center">
                <div class="text-[9px] font-bold text-gray-400 uppercase tracking-wider">Score</div>
                <div id="score-val" class="text-sm font-black text-gray-800">0</div>
            </div>
        </div>
    </div>

    <!-- Start / Restart / Next Level Screens (Appears after Giant Dance) -->
    <div id="end-screen" class="absolute inset-0 bg-black/50 backdrop-blur-sm hidden flex flex-col items-center justify-center z-30">
        <div class="hud-glass p-8 rounded-3xl text-center max-w-xs w-full shadow-2xl animate-bounce-short">
            <div id="end-title" class="text-2xl font-black text-gray-800 mb-2">লেভেল ১ বিজয়ী!</div>
            <div id="end-subtitle" class="text-sm text-gray-600 mb-6">দৈত্য মেয়েটি উল্লাসে লাফিয়ে উঠছে!</div>
            <div class="bg-emerald-50 border border-emerald-200 rounded-2xl py-3 mb-6">
                <div class="text-xs text-emerald-600 font-semibold uppercase">মোট স্কোর</div>
                <div id="final-score" class="text-3xl font-black text-emerald-700">160</div>
            </div>
            <button id="action-btn" class="w-full bg-gradient-to-r from-emerald-500 to-green-600 text-white font-bold py-3 px-6 rounded-2xl shadow-lg hover:opacity-90 active:scale-95 transition">
                পরবর্তী লেভেল →
            </button>
        </div>
    </div>

    <!-- Main Game Logic script -->
    <script>
        // Game State Variables
        let scene, camera, renderer;
        let player;
        let currentLevel = 1;
        let score = 0;
        let gameActive = false;
        let trackLength = 150;
        let playerZ = 0;
        let playerX = 0;
        let targetX = 0;
        
        // Speeds & Physics (Normal & Smooth Speed)
        const forwardSpeeds = { 1: 0.12, 2: 0.15, 3: 0.18 };
        let forwardSpeed = forwardSpeeds[1];
        let hopSpeed = 0.12;
        let hopHeight = 0.35;
        let hopAngle = 0;

        // Color Themes
        const juiceColors = [
            { name: "Green Juice", color: 0x2ecc71, hex: "#2ecc71" },
            { name: "Red Juice", color: 0xe74c3c, hex: "#e74c3c" },
            { name: "Yellow Juice", color: 0xf1c40f, hex: "#f1c40f" },
            { name: "Purple Juice", color: 0x9b59b6, hex: "#9b59b6" },
            { name: "Blue Juice", color: 0x3498db, hex: "#3498db" }
        ];
        let currentColorIndex = 0;

        // Obstacles & Collectibles arrays
        let obstacles = [];
        let collectibles = [];
        let colorGates = [];
        let giantGirl;
        let giantDancing = false;
        let danceTimer = 0;

        // Audio Context for Sound FX
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'collect') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.15);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'hit') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(60, now + 0.2);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'win') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.setValueAtTime(450, now + 0.1);
                osc.frequency.setValueAtTime(600, now + 0.2);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.35);
                osc.start(now);
                osc.stop(now + 0.35);
            }
        }

        // Initialize Three.js Scene
        function init() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.FogExp2(0x87CEEB, 0.008);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 4.5, -6);
            camera.lookAt(0, 1.5, 2);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(20, 40, -20);
            dirLight.castShadow = true;
            scene.add(dirLight);

            buildEnvironment();
            createPlayer();
            loadLevel(currentLevel);

            // Event Listeners for controls
            window.addEventListener('resize', onWindowResize);
            
            let isDragging = false;
            let startX = 0;

            window.addEventListener('pointerdown', (e) => {
                isDragging = true;
                startX = e.clientX;
            });

            window.addEventListener('pointermove', (e) => {
                if (!isDragging || !gameActive) return;
                const deltaX = (e.clientX - startX) * 0.008;
                targetX = Math.max(-2.2, Math.min(2.2, targetX + deltaX));
                startX = e.clientX;
            });

            window.addEventListener('pointerup', () => { isDragging = false; });

            // Keyboard support
            window.addEventListener('keydown', (e) => {
                if (!gameActive) return;
                if (e.key === 'ArrowLeft' || e.key === 'a') targetX = Math.max(-2.2, targetX - 0.6);
                if (e.key === 'ArrowRight' || e.key === 'd') targetX = Math.min(2.2, targetX + 0.6);
            });

            // Start game button trigger (auto start on load for smooth UX)
            startGame();
            animate();
        }

        // Build Environment (Track, Palm Trees, Finish Line)
        function buildEnvironment() {
            // Road Track
            const roadGeo = new THREE.BoxGeometry(6, 0.2, trackLength + 30);
            const roadMat = new THREE.MeshStandardMaterial({ color: 0xf8f9fa, roughness: 0.9 });
            const road = new THREE.Mesh(roadGeo, roadMat);
            road.position.set(0, -0.1, trackLength / 2 - 10);
            road.receiveShadow = true;
            scene.add(road);

            // Palm Trees along the road
            for (let z = 5; z < trackLength; z += 12) {
                createPalmTree(-4.5, z);
                createPalmTree(4.5, z);
            }

            // Finish Line Arch & Giant Girl
            createFinishArea();
        }

        function createPalmTree(x, z) {
            const trunkGeo = new THREE.CylinderGeometry(0.2, 0.3, 5, 6);
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b });
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.set(x, 2.5, z);
            scene.add(trunk);

            // Leaves
            for (let i = 0; i < 5; i++) {
                const leafGeo = new THREE.ConeGeometry(1.2, 0.2, 4);
                const leafMat = new THREE.MeshStandardMaterial({ color: 0x27ae60 });
                const leaf = new THREE.Mesh(leafGeo, leafMat);
                leaf.position.set(x, 5, z);
                leaf.rotation.z = (i * 72 * Math.PI) / 180;
                leaf.rotation.x = 0.3;
                scene.add(leaf);
            }
        }

        // Create Juice Glass Character
        function createPlayer() {
            player = new THREE.Group();

            // Glass Body
            const glassGeo = new THREE.CylinderGeometry(0.5, 0.35, 1.4, 16);
            const glassMat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, transparent: true, opacity: 0.4, roughness: 0.1, transmission: 0.9 });
            const glassMesh = new THREE.Mesh(glassGeo, glassMat);
            glassMesh.position.y = 0.7;
            player.add(glassMesh);

            // Juice inside
            const juiceGeo = new THREE.CylinderGeometry(0.48, 0.33, 1.2, 16);
            const juiceMat = new THREE.MeshStandardMaterial({ color: juiceColors[currentColorIndex].color, roughness: 0.3 });
            player.juiceMesh = new THREE.Mesh(juiceGeo, juiceMat);
            player.juiceMesh.position.y = 0.6;
            player.add(player.juiceMesh);

            // Eyes & Smile (Face)
            const eyeGeo = new THREE.SphereGeometry(0.08, 8, 8);
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
            
            const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
            leftEye.position.set(-0.18, 0.9, 0.4);
            player.add(leftEye);

            const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
            rightEye.position.set(0.18, 0.9, 0.4);
            player.add(rightEye);

            // Straw
            const strawGeo = new THREE.CylinderGeometry(0.04, 0.04, 1.2, 8);
            const strawMat = new THREE.MeshStandardMaterial({ color: 0xe74c3c });
            const straw = new THREE.Mesh(strawGeo, strawMat);
            straw.position.set(0.2, 1.4, 0);
            straw.rotation.z = -0.3;
            player.add(straw);

            player.position.set(0, 0, 0);
            scene.add(player);
        }

        // Create Finish Line & Giant Girl Boss
        function createFinishArea() {
            const finishZ = trackLength - 5;

            // Giant Girl Group
            giantGirl = new THREE.Group();
            
            // Body / Dress
            const dressGeo = new THREE.ConeGeometry(1.2, 3, 16);
            const dressMat = new THREE.MeshStandardMaterial({ color: 0xe91e63 });
            const dress = new THREE.Mesh(dressGeo, dressMat);
            dress.position.y = 1.5;
            giantGirl.add(dress);

            // Head
            const headGeo = new THREE.SphereGeometry(0.7, 16, 16);
            const headMat = new THREE.MeshStandardMaterial({ color: 0xffdbac });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 3.5;
            giantGirl.add(head);

            giantGirl.position.set(0, 0, finishZ + 8);
            scene.add(giantGirl);
        }

        // Load Level Obstacles & Collectibles
        function loadLevel(lvl) {
            // Clear old obstacles
            obstacles.forEach(o => scene.remove(o.mesh));
            collectibles.forEach(c => scene.remove(c.mesh));
            colorGates.forEach(g => scene.remove(g.mesh));
            obstacles = [];
            collectibles = [];
            colorGates = [];

            forwardSpeed = forwardSpeeds[lvl];
            document.getElementById('level-badge').innerText = `LVL ${lvl}`;

            // Generate Obstacles & Collectibles based on level
            let count = 6 + lvl * 3;
            for (let i = 1; i <= count; i++) {
                let zPos = i * (trackLength / (count + 2));

                // Add Color Gate
                if (i % 2 === 0) {
                    let cIndex = Math.floor(Math.random() * juiceColors.length);
                    createColorGate(zPos, cIndex);
                }

                // Add Collectibles (Juice Cups)
                for (let c = -1; c <= 1; c++) {
                    let cIndex = Math.floor(Math.random() * juiceColors.length);
                    createCollectible(c * 1.5, zPos + 3, cIndex);
                }

                // Add Obstacles (Spike Gates / Hammers)
                if (i % 3 === 0) {
                    createObstacle(zPos);
                }
            }
        }

        function createCollectible(x, z, colorIdx) {
            const group = new THREE.Group();
            const glassGeo = new THREE.CylinderGeometry(0.3, 0.2, 0.9, 12);
            const glassMat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, transparent: true, opacity: 0.5, transmission: 0.8 });
            const glass = new THREE.Mesh(glassGeo, glassMat);
            group.add(glass);

            const juiceGeo = new THREE.CylinderGeometry(0.28, 0.18, 0.7, 12);
            const juiceMat = new THREE.MeshStandardMaterial({ color: juiceColors[colorIdx].color });
            const juice = new THREE.Mesh(juiceGeo, juiceMat);
            juice.position.y = -0.05;
            group.add(juice);

            group.position.set(x, 0.45, z);
            scene.add(group);
            collectibles.push({ mesh: group, colorIdx: z, collected: false });
        }

        function createObstacle(z) {
            const group = new THREE.Group();
            const barGeo = new THREE.BoxGeometry(5, 0.8, 0.4);
            const barMat = new THREE.MeshStandardMaterial({ color: 0x8e44ad });
            const bar = new THREE.Mesh(barGeo, barMat);
            bar.position.y = 0.8;
            group.add(bar);

            group.position.set(0, 0, z);
            scene.add(group);
            obstacles.push({ mesh: group, z: z });
        }

        function createColorGate(z, colorIdx) {
            const archGeo = new THREE.TorusGeometry(2.5, 0.15, 8, 32, Math.PI);
            const archMat = new THREE.MeshStandardMaterial({ color: juiceColors[colorIdx].color, emissive: juiceColors[colorIdx].color, emissiveIntensity: 0.5 });
            const arch = new THREE.Mesh(archGeo, archMat);
            arch.rotation.z = Math.PI / 2;
            arch.position.set(0, 0, z);
            scene.add(arch);
            colorGates.push({ mesh: arch, z: z, colorIdx: colorIdx });
        }

        function startGame() {
            gameActive = true;
            playerZ = 0;
            playerX = 0;
            targetX = 0;
            score = 0;
            giantDancing = false;
            danceTimer = 0;
            document.getElementById('end-screen').classList.add('hidden');
            giantGirl.position.y = 0;
        }

        // Game Loop
        function animate() {
            requestAnimationFrame(animate);

            if (gameActive) {
                // Move player forward
                playerZ += forwardSpeed;
                playerX += (targetX - playerX) * 0.1;
                player.position.x = playerX;
                player.position.z = playerZ;

                // Hopping / Bouncing Animation
                hopAngle += hopSpeed;
                let currentHop = Math.abs(Math.sin(hopAngle)) * hopHeight;
                player.position.y = currentHop;
                player.rotation.z = Math.sin(hopAngle * 0.5) * 0.05;

                // Camera follow
                camera.position.z = playerZ - 6;
                camera.position.x = playerX * 0.5;

                // Update Progress bar
                let progress = Math.min(100, (playerZ / (trackLength - 5)) * 100);
                document.getElementById('progress-bar').style.width = `${progress}%`;

                // Check Collisions with Collectibles
                collectibles.forEach(col => {
                    if (!col.collected && Math.abs(player.position.z - col.mesh.position.z) < 0.8 && Math.abs(player.position.x - col.mesh.position.x) < 0.8) {
                        col.collected = true;
                        scene.remove(col.mesh);
                        score += 20;
                        document.getElementById('score-val').innerText = score;
                        playSound('collect');
                    }
                });

                // Check Collisions with Obstacles
                obstacles.forEach(obs => {
                    if (!obs.hit && Math.abs(player.position.z - obs.z) < 0.6 && Math.abs(player.position.x) < 2.0) {
                        obs.hit = true;
                        score = Math.max(0, score - 30);
                        document.getElementById('score-val').innerText = score;
                        playSound('hit');
                    }
                });

                // Check Color Gates
                colorGates.forEach(gate => {
                    if (!gate.passed && Math.abs(player.position.z - gate.z) < 0.5) {
                        gate.passed = true;
                        currentColorIndex = gate.colorIdx;
                        player.juiceMesh.material.color.setHex(juiceColors[currentColorIndex].color);
                        document.getElementById('color-indicator').style.backgroundColor = juiceColors[currentColorIndex].hex;
                        document.getElementById('color-text').innerText = juiceColors[currentColorIndex].name;
                        document.getElementById('color-text').style.color = juiceColors[currentColorIndex].hex;
                    }
                });

                // Check Finish Line
                if (playerZ >= trackLength - 5) {
                    gameActive = false;
                    giantDancing = true;
                    danceTimer = 0;
                    playSound('win');
                }
            } else if (giantDancing) {
                // Giant girl dancing/jumping animation at finish line
                danceTimer += 0.08;
                giantGirl.position.y = Math.abs(Math.sin(danceTimer)) * 1.5;
                giantGirl.rotation.y += 0.05;

                if (danceTimer > 4.5) {
                    giantDancing = false;
                    showEndScreen();
                }
            }

            renderer.render(scene, camera);
        }

        function showEndScreen() {
            const endScreen = document.getElementById('end-screen');
            const endTitle = document.getElementById('end-title');
            const endSubtitle = document.getElementById('end-subtitle');
            const finalScore = document.getElementById('final-score');
            const actionBtn = document.getElementById('action-btn');

            finalScore.innerText = score;

            if (currentLevel < 3) {
                endTitle.innerText = `লেভেল ${currentLevel} বিজয়ী!`;
                endSubtitle.innerText = "দৈত্য মেয়েটি উল্লাসে লাফিয়ে উঠছে!";
                actionBtn.innerText = "পরবর্তী লেভেল →";
                actionBtn.onclick = () => {
                    currentLevel++;
                    loadLevel(currentLevel);
                    startGame();
                };
            } else {
                endTitle.innerText = "অভিনন্দন! গেম সম্পন্ন!";
                endSubtitle.innerText = "আপনি সমস্ত লেভেল সফলভাবে পার করেছেন!";
                actionBtn.innerText = "আবার খেলুন ↺";
                actionBtn.onclick = () => {
                    currentLevel = 1;
                    loadLevel(currentLevel);
                    startGame();
                };
            }
            endScreen.classList.remove('hidden');
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = init;
    </script>
</body>
</html>
