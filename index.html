<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Speed Car Racing - Shorts Edition</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: #111;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        /* ৯:১৬ ভার্টিক্যাল শর্টস ফ্রেম */
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 405px;
            max-height: 720px;
            background: #222;
            box-shadow: 0 0 25px rgba(0,0,0,0.9);
            overflow: hidden;
            border: 4px solid #444;
            border-radius: 12px;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            text-align: center;
            padding: 20px;
        }
        h1 {
            color: #00ffcc;
            font-size: 30px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(0,255,204,0.6);
        }
        p {
            color: #ddd;
            font-size: 16px;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        .btn {
            background: linear-gradient(135deg, #00ffcc, #0077ff);
            color: #111;
            border: none;
            padding: 14px 38px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0,255,204,0.4);
            transition: 0.2s;
        }
        .btn:active {
            transform: scale(0.95);
        }
        #ui-score {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
            z-index: 5;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="ui-score">স্কোর: <span id="scoreVal">0</span></div>
    <canvas id="gameCanvas"></canvas>

    <div id="overlay">
        <h1>SPEED CAR RACING</h1>
        <p>স্ক্রিনে আঙুল দিয়ে চেপে ধরুন গাড়ি দ্রুত ছুটবে!<br>অন্য গাড়ি ও বাধা এড়িয়ে সামনে এগিয়ে যান।</p>
        <button class="btn" onclick="startGame()">রেস শুরু করুন</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    canvas.width = 405;
    canvas.height = 720;

    let gameState = 'START'; // START, PLAYING, GAMEOVER
    let score = 0;
    let roadSpeed = 5;
    let boostActive = false;

    // প্লেয়ার গাড়ি
    let playerCar = {
        x: canvas.width / 2 - 25,
        y: canvas.height - 130,
        width: 50,
        height: 90,
        speed: 4
    };

    // রাস্তা ও ব্যাকগ্রাউন্ড ল্যান্ডস্কেপ ভ্যারিয়েবল
    let roadOffset = 0;
    let obstacles = [];
    let scenery = [];

    // ওয়েব অডিও সাউন্ড ইফেক্ট জেনারেটর
    let audioCtx = null;
    function playSound(type) {
        try {
            audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'boost') {
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(350, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'crash') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(30, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            }
        } catch(e) {}
    }

    // টাচ এবং মাউস কন্ট্রোল (চেপে ধরলে জোর বা স্পিড বাড়বে)
    window.addEventListener('mousedown', () => { boostActive = true; playSound('boost'); });
    window.addEventListener('mouseup', () => { boostActive = false; });

    window.addEventListener('touchstart', (e) => { boostActive = true; playSound('boost'); e.preventDefault(); }, { passive: false });
    window.addEventListener('touchend', () => { boostActive = false; });

    // মাউস বা টাচ দিয়ে ডানে-বামে গাড়ি সরানোর জন্য
    window.addEventListener('mousemove', (e) => {
        if (gameState !== 'PLAYING') return;
        const rect = canvas.getBoundingClientRect();
        let mouseX = (e.clientX - rect.left) * (canvas.width / rect.width);
        playerCar.x = mouseX - playerCar.width / 2;
    });

    window.addEventListener('touchmove', (e) => {
        if (gameState !== 'PLAYING') return;
        const rect = canvas.getBoundingClientRect();
        let touchX = (e.touches[0].clientX - rect.left) * (canvas.width / rect.width);
        playerCar.x = touchX - playerCar.width / 2;
        e.preventDefault();
    }, { passive: false });

    function startGame() {
        gameState = 'PLAYING';
        score = 0;
        obstacles = [];
        playerCar.x = canvas.width / 2 - 25;
        document.getElementById('overlay').style.display = 'none';
    }

    function gameOver() {
        gameState = 'GAMEOVER';
        playSound('crash');
        document.getElementById('overlay').innerHTML = `
            <h1 style="color: #ff3333;">দুর্ঘটনা! গেম ওভার</h1>
            <p>আপনার মোট স্কোর: ${Math.floor(score)}</p>
            <button class="btn" onclick="startGame()">পুনরায় খেলুন</button>
        `;
        document.getElementById('overlay').style.display = 'flex';
    }

    function update() {
        if (gameState !== 'PLAYING') return;

        // স্পিড এবং বুস্ট লজিক (চেপে ধরলে স্পিড দ্বিগুণ হবে)
        let currentSpeed = boostActive ? roadSpeed * 2.2 : roadSpeed;
        roadOffset += currentSpeed;
        score += currentSpeed * 0.1;
        document.getElementById('scoreVal').innerText = Math.floor(score);

        // রাস্তার সীমানার মধ্যে প্লেয়ার গাড়ি রাখা
        if (playerCar.x < 55) playerCar.x = 55;
        if (playerCar.x > canvas.width - 55 - player.width) playerCar.x = canvas.width - 55 - player.width;

        // বাধা বা অন্য গাড়ি তৈরি করা
        if (Math.random() < 0.03) {
            let laneX = [80, 175, 270][Math.floor(Math.random() * 3)];
            obstacles.push({
                x: laneX,
                y: -100,
                width: 50,
                height: 90,
                color: ['#ff3366', '#3366ff', '#9933ff', '#ff9900'][Math.floor(Math.random() * 4)]
            });
        }

        // বাধা আপডেট ও কলিশন চেক
        for (let i = obstacles.length - 1; i >= 0; i--) {
            obstacles[i].y += currentSpeed * 0.8;

            // কলিশন (ধাক্কা লাগলে গেম ওভার)
            if (
                playerCar.x < obstacles[i].x + obstacles[i].width &&
                playerCar.x + playerCar.width > obstacles[i].x &&
                playerCar.y < obstacles[i].y + obstacles[i].height &&
                player.y + player.height > obstacles[i].y
            ) {
                gameOver();
            }

            // স্ক্রিনের বাইরে চলে গেলে রিমুভ করা
            if (obstacles[i].y > canvas.height) {
                obstacles.splice(i, 1);
            }
        }
    }

    // গ্রাফিক্স ড্র করা
    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // গ্রিন ব্যাকগ্রাউন্ড (ঘাস)
        ctx.fillStyle = '#1e7e34';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // মূল পিচ ঢালাই রাস্তা
        ctx.fillStyle = '#333';
        ctx.fillRect(50, 0, canvas.width - 100, canvas.height);

        // রাস্তার দুইপাশের সাদা বর্ডার লাইন
        ctx.fillStyle = '#fff';
        ctx.fillRect(45, 0, 8, canvas.height);
        ctx.fillRect(canvas.width - 53, 0, 8, canvas.height);

        // রাস্তার মাঝের ডিভাইডার লাইন (মুভিং ইফেক্ট)
        ctx.strokeStyle = '#f1c40f';
        ctx.lineWidth = 6;
        ctx.setLineDash([30, 30]);
        ctx.lineDashOffset = -roadOffset;
        ctx.beginPath();
        ctx.moveTo(canvas.width / 2, 0);
        ctx.lineTo(canvas.width / 2, canvas.height);
        ctx.stroke();
        ctx.setLineDash([]); // রিসেট

        // বাধা বা বিপক্ষ গাড়িগুলো ড্র করা
        for (let obs of obstacles) {
            ctx.fillStyle = obs.color;
            ctx.beginPath();
            ctx.roundRect(obs.x, obs.y, obs.width, obs.height, 10);
            ctx.fill();

            // উইন্ডস্ক্রিন ও লাইট
            ctx.fillStyle = '#111';
            ctx.fillRect(obs.x + 8, obs.y + 15, obs.width - 16, 20);
            ctx.fillRect(obs.x + 8, obs.y + 60, obs.width - 16, 15);
        }

        // প্লেয়ার গাড়ি ড্র করা (সুন্দর ডিজাইন)
        ctx.save();
        ctx.translate(playerCar.x + playerCar.width / 2, playerCar.y + playerCar.height / 2);
        if (boostActive) {
            // বুস্ট দিলে পেছনের ইফেক্ট
            ctx.fillStyle = '#00ffff';
            ctx.fillRect(-15, playerCar.height / 2, 30, 15);
        }

        ctx.fillStyle = '#ffcc00';
        ctx.beginPath();
        ctx.roundRect(-playerCar.width / 2, -playerCar.height / 2, playerCar.width, playerCar.height, 10);
        ctx.fill();

        // উইন্ডস্ক্রিন ও হেডলাইট
        ctx.fillStyle = '#111';
        ctx.fillRect(-playerCar.width / 2 + 8, -playerCar.height / 2 + 15, playerCar.width - 16, 20);
        ctx.fillStyle = '#fff';
        ctx.fillRect(-playerCar.width / 2 + 6, -playerCar.height / 2 - 2, 8, 5);
        ctx.fillRect(playerCar.width / 2 - 14, -playerCar.height / 2 - 2, 8, 5);
        ctx.restore();
    }

    // মূল গেম লুপ
    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    loop();
</script>

</body>
</html>
