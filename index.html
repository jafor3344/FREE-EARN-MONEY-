<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tom & Friends Metallic Green Maze Dash</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;800&display=swap');
        
        body {
            font-family: 'Fredoka', sans-serif;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            background-color: #060911;
            height: 100dvh;
            overflow: hidden;
        }

        .arcade-card {
            background: linear-gradient(145deg, #131926, #090d16);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.08);
            border: 1.5px solid rgba(16, 185, 129, 0.3);
        }

        .arcade-btn {
            background: linear-gradient(180deg, #10b981 0%, #047857 100%);
            box-shadow: 0 3px 0 #065f46, 0 4px 8px rgba(0,0,0,0.5);
            transition: all 0.1s ease;
        }

        .arcade-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #065f46, 0 2px 4px rgba(0,0,0,0.4);
        }

        .shorts-container {
            aspect-ratio: 9 / 16;
            width: 100%;
            max-width: 360px;
            max-height: 68vh;
            position: relative;
        }

        canvas {
            touch-action: none;
            image-rendering: pixelated;
        }
    </style>
</head>
<body class="text-white h-screen flex flex-col items-center justify-between p-2 overflow-hidden select-none">

    <header class="w-full max-w-sm flex items-center justify-between gap-1.5 p-2 arcade-card rounded-xl shrink-0">
        <div class="flex items-center gap-1.5">
            <div class="w-8 h-8 rounded-lg bg-emerald-500/20 flex items-center justify-center border border-emerald-400/40 text-lg">
                🐱
            </div>
            <div>
                <h1 class="text-xs font-black text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-yellow-300 leading-none">
                    TOM MAZE SHORTS
                </h1>
                <p id="modeBadge" class="text-[9px] text-emerald-400 font-bold uppercase tracking-wider mt-0.5">Classic • Level 1</p>
            </div>
        </div>

        <div class="flex items-center gap-1.5 font-bold text-[11px]">
            <div class="bg-gray-900/90 px-2 py-0.5 rounded-lg border border-gray-700/60 flex items-center gap-1">
                <i class="fa-solid fa-trophy text-yellow-400 text-[10px]"></i>
                <span id="scoreDisplay" class="text-yellow-400">0</span>
            </div>
            <div class="bg-gray-900/90 px-2 py-0.5 rounded-lg border border-gray-700/60 flex items-center gap-1">
                <i class="fa-solid fa-clock text-emerald-400 text-[10px]"></i>
                <span id="timerDisplay" class="text-emerald-400">00:00</span>
            </div>
            <button id="soundToggleBtn" class="p-1 bg-gray-900 hover:bg-gray-800 rounded-lg border border-gray-700 text-gray-300">
                <i id="soundIcon" class="fa-solid fa-volume-high text-[10px]"></i>
            </button>
        </div>
    </header>

    <main class="w-full flex-1 flex flex-col items-center justify-center gap-1.5 max-w-sm min-h-0">
        <div class="w-full grid grid-cols-2 gap-1.5 shrink-0">
            <select id="categorySelect" class="bg-gray-900 border border-emerald-500/50 rounded-lg px-2 py-1 text-[11px] font-bold text-emerald-300 focus:outline-none">
                <option value="classic">🏆 Classic Puzzle</option>
                <option value="shield">🛡️ Shield Dash</option>
                <option value="monster">🐂 Monster Patrol</option>
                <option value="time">⚡ Time Attack</option>
            </select>
            <select id="levelSelect" class="bg-gray-900 border border-emerald-500/50 rounded-lg px-2 py-1 text-[11px] font-bold text-yellow-400 focus:outline-none">
                <!-- Populated dynamically 1 to 20 -->
            </select>
        </div>

        <div class="shorts-container arcade-card p-1.5 rounded-2xl overflow-hidden border-2 border-emerald-500/40 shadow-xl flex items-center justify-center">
            <canvas id="gameCanvas" class="w-full h-full rounded-xl bg-amber-950/20 cursor-grab active:cursor-grabbing"></canvas>

            <div id="gameOverlay" class="absolute inset-0 bg-slate-950/92 backdrop-blur-sm flex flex-col items-center justify-center p-4 text-center z-20">
                <div id="overlayIcon" class="text-5xl mb-1 animate-bounce">🐱</div>
                <h2 id="overlayTitle" class="text-xl font-black text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-yellow-400 mb-0.5">
                    TOM'S GREEN MAZE
                </h2>
                <p id="overlaySubtitle" class="text-[11px] text-gray-300 max-w-xs mb-3 leading-tight">
                    Watch out for patrolling enemies blocking paths! Smoothly drag Tom to the Trophy.
                </p>
                <button id="startPlayBtn" class="px-6 py-2 rounded-xl font-black text-xs uppercase tracking-wider arcade-btn text-white flex items-center gap-1.5">
                    Start Game <i class="fa-solid fa-play text-[10px]"></i>
                </button>
            </div>
        </div>

        <div class="w-full flex items-center justify-between gap-1.5 shrink-0">
            <button id="restartBtn" class="flex-1 py-1.5 rounded-lg text-[11px] font-bold uppercase tracking-wider arcade-btn text-white flex items-center justify-center gap-1">
                <i class="fa-solid fa-rotate-right text-[10px]"></i> Restart
            </button>
            <div class="flex items-center gap-1" id="avatarPicker">
                <button class="avatar-option px-2 py-0.5 rounded-lg bg-emerald-600/40 border-2 border-emerald-400 text-sm" data-avatar="tom">🐱</button>
                <button class="avatar-option px-2 py-0.5 rounded-lg bg-gray-900 border border-gray-700 text-sm" data-avatar="jerry">🐭</button>
                <button class="avatar-option px-2 py-0.5 rounded-lg bg-gray-900 border border-gray-700 text-sm" data-avatar="hero">🛡️</button>
            </div>
        </div>
    </main>

    <script>
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }
            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }
            playTone(freq, type, duration, gainVal = 0.08) {
                if (!this.enabled) return;
                try {
                    this.init();
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch (e) {}
            }
            step() { this.playTone(280, 'triangle', 0.03, 0.02); }
            collect() {
                this.playTone(523.25, 'sine', 0.08, 0.1);
                setTimeout(() => this.playTone(659.25, 'sine', 0.12, 0.1), 60);
            }
            powerup() {
                this.playTone(350, 'square', 0.08, 0.1);
                setTimeout(() => this.playTone(500, 'square', 0.08, 0.1), 70);
                setTimeout(() => this.playTone(700, 'square', 0.12, 0.1), 140);
            }
            hit() { this.playTone(110, 'sawtooth', 0.3, 0.2); }
            win() {
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                    setTimeout(() => this.playTone(freq, 'triangle', 0.2, 0.12), i * 90);
                });
            }
        }

        const audio = new SoundEngine();

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let currentLevel = 1;
        let cols = 9;
        let rows = 13;
        let cellW = 30;
        let cellH = 30;
        let grid = [];

        let player = {
            gridX: 1,
            gridY: 1,
            pixelX: 0,
            pixelY: 0,
            targetPixelX: 0,
            targetPixelY: 0,
            avatar: 'tom',
            shielded: false,
            shieldTime: 0
        };

        let goal = { x: 7, y: 11 };
        let enemies = [];
        let collectibles = [];
        let rings = [];
        let score = 0;
        let gameTime = 0;
        let timerInterval = null;
        let isRunning = false;
        let isGameOver = false;
        let isDragging = false;
        let ringAngle = 0;

        const levelSelect = document.getElementById('levelSelect');
        for (let l = 1; l <= 20; l++) {
            const opt = document.createElement('option');
            opt.value = l;
            opt.innerText = `Level ${l} (${l <= 5 ? 'Easy' : l <= 12 ? 'Medium' : l <= 17 ? 'Hard' : 'Expert'})`;
            levelSelect.appendChild(opt);
        }

        document.getElementById('soundToggleBtn').addEventListener('click', () => {
            audio.enabled = !audio.enabled;
            document.getElementById('soundIcon').className = audio.enabled ? 'fa-solid fa-volume-high text-[10px]' : 'fa-solid fa-volume-xmark text-red-400 text-[10px]';
        });

        function generateStrategicMaze(lvl) {
            currentLevel = parseInt(lvl);
            
            if (currentLevel <= 5) { cols = 9; rows = 13; }
            else if (currentLevel <= 12) { cols = 11; rows = 15; }
            else if (currentLevel <= 17) { cols = 13; rows = 17; }
            else { cols = 15; rows = 19; }

            grid = Array(rows).fill(0).map(() => Array(cols).fill(1));

            function carve(r, c) {
                grid[r][c] = 0;
                const dirs = [[-2, 0], [2, 0], [0, -2], [0, 2]].sort(() => Math.random() - 0.5);
                dirs.forEach(([dr, dc]) => {
                    const nr = r + dr, nc = c + dc;
                    if (nr > 0 && nr < rows - 1 && nc > 0 && nc < cols - 1 && grid[nr][nc] === 1) {
                        grid[r + dr / 2][c + dc / 2] = 0;
                        carve(nr, nc);
                    }
                });
            }
            carve(1, 1);

            player.gridX = 1;
            player.gridY = 1;
            goal = { x: cols - 2, y: rows - 2 };
            grid[goal.y][goal.x] = 0;

            for (let r = 1; r < rows - 1; r += 2) {
                if (r < rows - 2 && grid[r + 1][1] === 1) {
                    grid[r + 1][1] = 0;
                }
            }

            enemies = [];
            collectibles = [];
            rings = [];
            const enemyCount = Math.min(5, 1 + Math.floor(currentLevel / 4));

            // Patrolling enemies along pathways
            let placed = 0;
            for (let r = 3; r < rows - 2; r += 2) {
                if (grid[r][1] === 0 && placed < enemyCount) {
                    enemies.push({ 
                        x: 1, 
                        y: r, 
                        minY: Math.max(1, r - 2), 
                        maxY: Math.min(rows - 2, r + 2), 
                        dir: 1, 
                        type: placed % 2 === 0 ? 'bull' : 'dog' 
                    });
                    placed++;
                }
            }

            let safeCells = [];
            for (let r = 1; r < rows - 1; r++) {
                for (let c = 2; c < cols - 1; c++) {
                    if (grid[r][c] === 0 && !(c === goal.x && r === goal.y)) {
                        safeCells.push({ x: c, y: r });
                    }
                }
            }

            if (safeCells.length > 0) {
                const shieldPos = safeCells.splice(Math.floor(Math.random() * safeCells.length), 1)[0];
                collectibles.push({ x: shieldPos.x, y: shieldPos.y, type: 'shield' });
            }
            // Add Spinning Rings
            for (let i = 0; i < 3 && safeCells.length > 0; i++) {
                const ringPos = safeCells.splice(Math.floor(Math.random() * safeCells.length), 1)[0];
                rings.push({ x: ringPos.x, y: ringPos.y });
            }
            for (let i = 0; i < 2 && safeCells.length > 0; i++) {
                const cheesePos = safeCells.splice(Math.floor(Math.random() * safeCells.length), 1)[0];
                collectibles.push({ x: cheesePos.x, y: cheesePos.y, type: 'cheese' });
            }
        }

        function drawGreenMetallicBlock(x, y, w, h) {
            const bx = x * w;
            const by = y * h;
            const bevelX = w * 0.18;
            const bevelY = h * 0.18;

            ctx.fillStyle = '#059669';
            ctx.fillRect(bx, by, w, h);

            ctx.fillStyle = '#34d399';
            ctx.beginPath();
            ctx.moveTo(bx, by);
            ctx.lineTo(bx + w, by);
            ctx.lineTo(bx + w - bevelX, by + bevelY);
            ctx.lineTo(bx + bevelX, by + bevelY);
            ctx.lineTo(bx + bevelX, by + h - bevelY);
            ctx.lineTo(bx, by + h);
            ctx.fill();

            ctx.fillStyle = '#064e3b';
            ctx.beginPath();
            ctx.moveTo(bx + w, by);
            ctx.lineTo(bx + w, by + h);
            ctx.lineTo(bx, by + h);
            ctx.lineTo(bx + bevelX, by + h - bevelY);
            ctx.lineTo(bx + w - bevelX, by + h - bevelY);
            ctx.lineTo(bx + w - bevelX, by + bevelY);
            ctx.fill();

            ctx.fillStyle = '#05070a';
            ctx.fillRect(bx + bevelX, by + bevelY, w - bevelX * 2, h - bevelY * 2);

            ctx.fillStyle = '#a7f3d0';
            const rxDist = bevelX * 0.5;
            const ryDist = bevelY * 0.5;
            const rRad = Math.max(1.2, Math.min(w, h) * 0.05);
            [
                [bx + rxDist, by + ryDist],
                [bx + w - rxDist, by + ryDist],
                [bx + rxDist, by + h - ryDist],
                [bx + w - rxDist, by + h - ryDist]
            ].forEach(([rx, ry]) => {
                ctx.beginPath();
                ctx.arc(rx, ry, rRad, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function drawSquareTile(x, y, bgGrad, emoji, borderCol) {
            const padX = cellW * 0.05;
            const padY = cellH * 0.05;
            const tx = x * cellW + padX;
            const ty = y * cellH + padY;
            const tw = cellW - padX * 2;
            const th = cellH - padY * 2;

            ctx.save();
            ctx.fillStyle = bgGrad;
            ctx.beginPath();
            ctx.roundRect(tx, ty, tw, th, Math.min(tw, th) * 0.15);
            ctx.fill();

            if (borderCol) {
                ctx.strokeStyle = borderCol;
                ctx.lineWidth = 1.8;
                ctx.stroke();
            }

            ctx.font = `bold ${Math.min(tw, th) * 0.68}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(emoji, tx + tw / 2, ty + th / 2 + 1);
            ctx.restore();
        }

        // Draw Spinning Golden Rings
        function drawSpinningRing(x, y) {
            const cx = x * cellW + cellW / 2;
            const cy = y * cellH + cellH / 2;
            const radius = Math.min(cellW, cellH) * 0.35;

            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(ringAngle);
            
            ctx.strokeStyle = '#fbbf24';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(0, 0, radius, 0, Math.PI * 1.5);
            ctx.stroke();

            ctx.strokeStyle = '#fef08a';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 0, radius * 0.65, 0, Math.PI * 2);
            ctx.stroke();

            ctx.restore();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const bgGrad = ctx.createRadialGradient(
                canvas.width / 2, canvas.height / 2, 30,
                canvas.width / 2, canvas.height / 2, canvas.height / 1.1
            );
            bgGrad.addColorStop(0, '#eab308');
            bgGrad.addColorStop(0.6, '#ca8a04');
            bgGrad.addColorStop(1, '#61360c');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (grid[r][c] === 1) {
                        drawGreenMetallicBlock(c, r, cellW, cellH);
                    }
                }
            }

            // Draw Spinning Rings
            ringAngle += 0.08;
            rings.forEach(ring => {
                drawSpinningRing(ring.x, ring.y);
            });

            collectibles.forEach(item => {
                const grad = ctx.createLinearGradient(0, 0, cellW, cellH);
                if (item.type === 'shield') {
                    grad.addColorStop(0, '#3b82f6');
                    grad.addColorStop(1, '#1d4ed8');
                    drawSquareTile(item.x, item.y, grad, '🛡️', '#93c5fd');
                } else {
                    grad.addColorStop(0, '#facc15');
                    grad.addColorStop(1, '#ca8a04');
                    drawSquareTile(item.x, item.y, grad, '🧀', '#fef08a');
                }
            });

            const goalGrad = ctx.createLinearGradient(0, 0, cellW, cellH);
            goalGrad.addColorStop(0, '#10b981');
            goalGrad.addColorStop(1, '#047857');
            drawSquareTile(goal.x, goal.y, goalGrad, '🏆', '#a7f3d0');

            enemies.forEach(enemy => {
                const eGrad = ctx.createLinearGradient(0, 0, cellW, cellH);
                eGrad.addColorStop(0, '#ef4444');
                eGrad.addColorStop(1, '#991b1b');
                drawSquareTile(enemy.x, enemy.y, eGrad, enemy.type === 'bull' ? '🐂' : '🐕', '#fca5a5');
            });

            player.pixelX += (player.targetPixelX - player.pixelX) * 0.45;
            player.pixelY += (player.targetPixelY - player.pixelY) * 0.45;

            const pGrad = ctx.createLinearGradient(0, 0, cellW, cellH);
            pGrad.addColorStop(0, '#38bdf8');
            pGrad.addColorStop(1, '#0284c7');

            let icon = '🐱';
            if (player.avatar === 'jerry') icon = '🐭';
            if (player.avatar === 'hero') icon = '🦸';

            const padX = cellW * 0.05;
            const padY = cellH * 0.05;
            const tx = player.pixelX + padX;
            const ty = player.pixelY + padY;
            const tw = cellW - padX * 2;
            const th = cellH - padY * 2;

            ctx.save();
            ctx.fillStyle = pGrad;
            ctx.beginPath();
            ctx.roundRect(tx, ty, tw, th, Math.min(tw, th) * 0.15);
            ctx.fill();

            ctx.strokeStyle = player.shielded ? '#facc15' : '#e0f2fe';
            ctx.lineWidth = player.shielded ? 3 : 2;
            ctx.stroke();

            ctx.font = `bold ${Math.min(tw, th) * 0.7}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(icon, tx + tw / 2, ty + th / 2 + 1);
            ctx.restore();
        }

        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            cellW = canvas.width / cols;
            cellH = canvas.height / rows;

            player.pixelX = player.gridX * cellW;
            player.pixelY = player.gridY * cellH;
            player.targetPixelX = player.pixelX;
            player.targetPixelY = player.pixelY;
            draw();
        }

        function tryMoveTo(gx, gy) {
            if (!isRunning || isGameOver) return;
            if (gx >= 0 && gx < cols && gy >= 0 && gy < rows) {
                if (grid[gy][gx] === 0) {
                    if (player.gridX !== gx || player.gridY !== gy) {
                        audio.step();
                    }
                    player.gridX = gx;
                    player.gridY = gy;
                    player.targetPixelX = gx * cellW;
                    player.targetPixelY = gy * cellH;

                    for (let i = collectibles.length - 1; i >= 0; i--) {
                        if (collectibles[i].x === player.gridX && collectibles[i].y === player.gridY) {
                            const item = collectibles[i];
                            if (item.type === 'cheese') {
                                score += 200;
                                audio.collect();
                            } else if (item.type === 'shield') {
                                player.shielded = true;
                                player.shieldTime = Date.now() + 6000;
                                audio.powerup();
                            }
                            collectibles.splice(i, 1);
                            updateHUD();
                        }
                    }

                    for (let i = rings.length - 1; i >= 0; i--) {
                        if (rings[i].x === player.gridX && rings[i].y === player.gridY) {
                            score += 350;
                            audio.collect();
                            rings.splice(i, 1);
                            updateHUD();
                        }
                    }

                    if (player.gridX === goal.x && player.gridY === goal.y) {
                        handleWin();
                    }

                    checkEnemyCollision();
                }
            }
        }

        function handlePointerMove(e) {
            if (!isDragging || !isRunning || isGameOver) return;
            const rect = canvas.getBoundingClientRect();
            const pointerX = e.clientX - rect.left;
            const pointerY = e.clientY - rect.top;

            const targetGridX = Math.floor(pointerX / cellW);
            const targetGridY = Math.floor(pointerY / cellH);

            if (targetGridX !== player.gridX || targetGridY !== player.gridY) {
                const dx = Math.sign(targetGridX - player.gridX);
                const dy = Math.sign(targetGridY - player.gridY);

                if (dx !== 0 && grid[player.gridY][player.gridX + dx] === 0) {
                    tryMoveTo(player.gridX + dx, player.gridY);
                } else if (dy !== 0 && grid[player.gridY + dy][player.gridX] === 0) {
                    tryMoveTo(player.gridX, player.gridY + dy);
                }
            }
        }

        canvas.addEventListener('pointerdown', (e) => {
            isDragging = true;
            canvas.setPointerCapture(e.pointerId);
            handlePointerMove(e);
        });
        canvas.addEventListener('pointermove', handlePointerMove);
        canvas.addEventListener('pointerup', (e) => {
            isDragging = false;
            try { canvas.releasePointerCapture(e.pointerId); } catch (err) {}
        });
        canvas.addEventListener('pointercancel', () => { isDragging = false; });

        // Patrolling Enemy Logic (Blocking Paths without chasing player)
        function updateEnemies() {
            if (!isRunning || isGameOver) return;
            enemies.forEach(enemy => {
                let ny = enemy.y + enemy.dir;
                if (ny < enemy.minY || ny > enemy.maxY || grid[ny][enemy.x] === 1) {
                    enemy.dir *= -1;
                    ny = enemy.y + enemy.dir;
                }
                if (ny >= 0 && ny < rows && grid[ny][enemy.x] === 0) {
                    enemy.y = ny;
                }
            });
            checkEnemyCollision();
        }

        function checkEnemyCollision() {
            if (player.shieldTime && Date.now() > player.shieldTime) {
                player.shielded = false;
            }

            enemies.forEach(enemy => {
                if (enemy.x === player.gridX && enemy.y === player.gridY) {
                    if (player.shielded) {
                        audio.powerup();
                        player.shielded = false;
                        enemy.x = goal.x;
                        enemy.y = goal.y;
                    } else {
                        handleGameOver();
                    }
                }
            });
        }

        function updateHUD() {
            document.getElementById('scoreDisplay').innerText = score;
            const mins = Math.floor(gameTime / 60).toString().padStart(2, '0');
            const secs = (gameTime % 60).toString().padStart(2, '0');
            document.getElementById('timerDisplay').innerText = `${mins}:${secs}`;
        }

        function startGame() {
            const lvl = document.getElementById('levelSelect').value;
            const cat = document.getElementById('categorySelect').value;
            
            document.getElementById('modeBadge').innerText = `${cat.toUpperCase()} • LEVEL ${lvl}`;

            generateStrategicMaze(lvl);
            score = 0;
            gameTime = 0;
            isRunning = true;
            isGameOver = false;

            document.getElementById('gameOverlay').classList.add('hidden');

            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (isRunning) {
                    gameTime++;
                    updateHUD();
                }
            }, 1000);

            // Faster patrolling interval for added challenge
            if (window.enemyInterval) clearInterval(window.enemyInterval);
            window.enemyInterval = setInterval(() => {
                if (isRunning && !isGameOver) {
                    updateEnemies();
                }
            }, 400);

            resizeCanvas();
            updateHUD();
        }

        function handleWin() {
            isRunning = false;
            audio.win();
            score += Math.max(100, 1000 - gameTime * 15);
            updateHUD();

            const overlay = document.getElementById('gameOverlay');
            document.getElementById('overlayIcon').innerText = '🏆';
            document.getElementById('overlayTitle').innerText = `LEVEL ${currentLevel} CLEARED!`;
            document.getElementById('overlaySubtitle').innerText = `You reached the Trophy! Score: ${score} pts in ${gameTime}s.`;
            document.getElementById('startPlayBtn').innerText = currentLevel < 20 ? 'Next Level ➔' : 'Replay Level 1';
            overlay.classList.remove('hidden');

            if (currentLevel < 20) {
                document.getElementById('levelSelect').value = currentLevel + 1;
            }
        }

        function handleGameOver() {
            isRunning = false;
            isGameOver = true;
            audio.hit();

            const overlay = document.getElementById('gameOverlay');
            document.getElementById('overlayIcon').innerText = '💥';
            document.getElementById('overlayTitle').innerText = 'GAME OVER!';
            document.getElementById('overlaySubtitle').innerText = 'You were blocked by an enemy! Click Try Again to restart this level.';
            document.getElementById('startPlayBtn').innerText = 'Try Again';
            overlay.classList.remove('hidden');
        }

        function gameLoop() {
            if (isRunning) {
                draw();
            }
            requestAnimationFrame(gameLoop);
        }

        window.addEventListener('keydown', (e) => {
            if (['ArrowUp', 'KeyW'].includes(e.code)) tryMoveTo(player.gridX, player.gridY - 1);
            if (['ArrowDown', 'KeyS'].includes(e.code)) tryMoveTo(player.gridX, player.gridY + 1);
            if (['ArrowLeft', 'KeyA'].includes(e.code)) tryMoveTo(player.gridX - 1, player.gridY);
            if (['ArrowRight', 'KeyD'].includes(e.code)) tryMoveTo(player.gridX + 1, player.gridY);
        });

        document.querySelectorAll('.avatar-option').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.avatar-option').forEach(b => {
                    b.classList.remove('bg-emerald-600/40', 'border-2', 'border-emerald-400');
                    b.classList.add('bg-gray-900', 'border-gray-700');
                });
                btn.classList.remove('bg-gray-900', 'border-gray-700');
                btn.classList.add('bg-emerald-600/40', 'border-2', 'border-emerald-400');
                player.avatar = btn.dataset.avatar;
                draw();
            });
        });

        document.getElementById('startPlayBtn').addEventListener('click', () => {
            audio.init();
            startGame();
        });

        document.getElementById('restartBtn').addEventListener('click', () => startGame());
        document.getElementById('categorySelect').addEventListener('change', () => startGame());
        document.getElementById('levelSelect').addEventListener('change', () => startGame());

        window.addEventListener('resize', resizeCanvas);

        window.onload = () => {
            generateStrategicMaze(1);
            resizeCanvas();
            requestAnimationFrame(gameLoop);
        };
    </script>
</body>
</html>
