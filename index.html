<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Juice Glass Runner 3D - Shorts Edition</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js for 3D Graphics -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            touch-action: none;
            background-color: #60a5fa;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        .glass-hud {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 2px solid rgba(255, 255, 255, 0.6);
        }
    </style>
</head>
<body>

    <!-- 3D Canvas -->
    <div id="canvas-container"></div>

    <!-- Minimal Top HUD (Shorts Optimized Corners) -->
    <div id="hud" class="fixed top-3 left-3 right-3 flex justify-between items-start pointer-events-none z-10">
        
        <!-- Top Left: Compact Level Badge -->
        <div class="glass-hud rounded-full px-4 py-2 flex items-center gap-2 shadow-lg pointer-events-auto">
            <div id="level-badge" class="px-2.5 py-1 rounded-full bg-amber-400 font-black text-amber-950 text-xs shadow flex items-center gap-1">
                <span>LVL</span> <span id="current-level-num">1</span>
            </div>
            <div class="w-16 bg-white/50 rounded-full h-3 overflow-hidden p-0.5 border border-white/60">
                <div id="progress-bar" class="bg-gradient-to-r from-orange-400 to-amber-500 h-full w-0 rounded-full transition-all duration-100"></div>
            </div>
        </div>

        <!-- Top Right: Compact Score Only -->
        <div class="glass-hud rounded-2xl px-4 py-1.5 shadow-md text-right pointer-events-auto">
            <div class="text-[9px] font-black text-sky-950 uppercase tracking-wider">Score</div>
            <div id="score-text" class="text-xl font-black text-emerald-950">0</div>
        </div>
    </div>

    <!-- Action Buttons (Appears after 8s Dance) -->
    <div id="game-over-screen" class="fixed inset-0 bg-transparent flex flex-col items-center justify-end z-30 hidden pb-12 pointer-events-none">
        <div id="button-container" class="flex flex-col gap-2 pointer-events-auto max-w-xs w-full px-6">
            <button id="next-level-btn" class="hidden w-full py-3.5 bg-emerald-500 hover:bg-emerald-400 text-white font-black text-lg rounded-2xl shadow-xl transform active:scale-95 transition flex items-center justify-center gap-2 border-b-4 border-emerald-700">
                পরবর্তী লেভেল <i class="fa-solid fa-arrow-right"></i>
            </button>
            <button id="restart-btn" class="w-full py-3.5 bg-amber-400 hover:bg-amber-300 text-amber-950 font-black text-lg rounded-2xl shadow-xl transform active:scale-95 transition flex items-center justify-center gap-2 border-b-4 border-amber-600">
                <i class="fa-solid fa-rotate-right"></i> আবার খেলুন
            </button>
        </div>
    </div>

    <!-- Main Game Logic -->
    <script>
        // Audio Synthesizer
        const AudioFX = {
            ctx: null,
            init() {
                if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            },
            playHop() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(220, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(440, this.ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.08);
            },
            playCollect() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, this.ctx.currentTime);
                osc.frequency.setValueAtTime(659.25, this.ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.2);
            },
            playColorGate() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.15);
            },
            playHit() {
                if (-this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(160, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.2);
            },
            playWin() {
                if (!this.ctx) return;
                const notes = [440, 554.37, 659.25, 880, 1046.50];
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.1);
                    gain.gain.setValueAtTime(0.2, this.ctx.currentTime + idx * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + idx * 0.1 + 0.3);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(this.ctx.currentTime + idx * 0.1);
                    osc.stop(this.ctx.currentTime + idx * 0.1 + 0.3);
                });
            }
        };

        const JUICE_COLORS = [
            { id: 'green', name: 'Green Juice', hex: 0x84cc16 },
            { id: 'red', name: 'Red Juice', hex: 0xef4444 },
            { id: 'yellow', name: 'Yellow Juice', hex: 0xeab308 },
            { id: 'blue', name: 'Blue Juice', hex: 0x3b82f6 },
            { id: 'purple', name: 'Purple Juice', hex: 0xa855f7 }
        ];

        let currentJuiceColor = JUICE_COLORS[0];

        let scene, camera, renderer;
        let playerGroup, glassMesh, juiceLevelMesh;
        let giantGirlGroup, girlHead, girlBody, girlArmL, girlArmR, girlLegL, girlLegR;
        let trackLength = 250;
        let trackCurve; // Winding track path
        let isPlaying = false;
        let isVictorious = false;
        let danceDurationTimer = 0;

        let currentLevel = 1;
        let score = 0;
        let juiceVolume = 100;
        let playerPos = { x: 0, z: 0 };
        let targetX = 0;

        let forwardSpeed = 0.14;
        const laneLimit = 2.4;

        let hopTime = 0;
        let hopFrequency = 6.5;
        const hopHeight = 0.7;
        let giantGirlJumpTime = 0;

        let colorGates = [];
        let collectibles = [];
        let obstacles = [];
        let palmTrees = [];
        let particles = [];

        let isDragging = false;
        let prevTouchX = 0;
        let keys = { ArrowLeft: false, ArrowRight: false, a: false, d: false };

        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x60a5fa);
            scene.fog = new THREE.FogExp2(0x60a5fa, 0.007);

            // Shorts Portrait Camera Setup
            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 300);
            camera.position.set(0, 5, -8);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            const ambient = new THREE.AmbientLight(0xffffff, 0.75);
            scene.add(ambient);

            const sunLight = new THREE.DirectionalLight(0xffffff, 0.9);
            sunLight.position.set(15, 30, -10);
            sunLight.castShadow = true;
            scene.add(sunLight);

            createJuiceGlassPlayer();
            setupInput();
            startLevel(1);

            window.addEventListener('resize', onWindowResize);
            animate(0);
        }

        // --- Build Winding Track World ---
        function buildLevelWorld(level) {
            colorGates.forEach(g => scene.remove(g));
            collectibles.forEach(c => scene.remove(c));
            obstacles.forEach(o => scene.remove(o));
            palmTrees.forEach(t => scene.remove(t));
            colorGates = [];
            collectibles = [];
            obstacles = [];
            palmTrees = [];

            if (giantGirlGroup) scene.remove(giantGirlGroup);

            if (level === 1) {
                forwardSpeed = 0.14;
                trackLength = 200;
            } else if (level === 2) {
                forwardSpeed = 0.17;
                trackLength = 250;
            } else {
                forwardSpeed = 0.20;
                trackLength = 300;
            }

            // Create Winding Curve Path (বাঁকা রাস্তা)
            const points = [];
            for (let z = 0; z <= trackLength; z += 10) {
                points.push(new THREE.Vector3(Math.sin(z * 0.015) * 3.2, 0, z));
            }
            trackCurve = new THREE.CatmullRomCurve3(points);

            // Build Curved Road Tube Geometry
            const existingTrack = scene.getObjectByName("track");
            if (existingTrack) scene.remove(existingTrack);

            const trackGeo = new THREE.TubeGeometry(trackCurve, 100, 3.2, 4, false);
            const trackMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 });
            const track = new THREE.Mesh(trackGeo, trackMat);
            track.name = "track";
            track.scale.set(1, 0.02, 1); // Flatten into a road ribbon
            track.receiveShadow = true;
            scene.add(track);

            // Spawn Palm Trees along the winding road curves
            for (let z = 15; z < trackLength - 10; z += 20) {
                const pt = trackCurve.getPoint(z / trackLength);
                spawnPalmTree(pt.x - 4.5, z);
                spawnPalmTree(pt.x + 4.5, z);
            }

            const finishZ = trackLength - 15;
            const finishPt = trackCurve.getPoint(finishZ / trackLength);

            const archGeo = new THREE.TorusGeometry(3.6, 0.3, 12, 24, Math.PI);
            const archMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b, roughness: 0.2 });
            const arch = new THREE.Mesh(archGeo, archMat);
            arch.position.set(finishPt.x, 0, finishZ);
            scene.add(arch);

            createGiantGirlCharacter(finishZ + 6, finishPt.x);

            let colorIndex = 0;
            for (let z = 30; z < finishZ - 20; z += 22) {
                const pt = trackCurve.getPoint(z / trackLength);
                const gateColor = JUICE_COLORS[(colorIndex++) % JUICE_COLORS.length];
                
                spawnColorGate(pt.x, z, gateColor);
                spawnGlassCluster(z + 8, gateColor);
                spawnStaticSpike(z + 15);
            }
        }

        function spawnPalmTree(x, z) {
            const treeGroup = new THREE.Group();
            treeGroup.position.set(x, 0, z);

            const trunkGeo = new THREE.CylinderGeometry(0.2, 0.35, 5, 8);
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b });
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.y = 2.5;
            treeGroup.add(trunk);

            const leafMat = new THREE.MeshStandardMaterial({ color: 0x15803d });
            for (let i = 0; i < 5; i++) {
                const leafGeo = new THREE.ConeGeometry(1.4, 0.3, 4);
                const leaf = new THREE.Mesh(leafGeo, leafMat);
                leaf.position.set(0, 5, 0);
                leaf.rotation.y = (i * 72 * Math.PI) / 180;
                leaf.rotation.z = 0.4;
                treeGroup.add(leaf);
            }
            scene.add(treeGroup);
            palmTrees.push(treeGroup);
        }

        function createGiantGirlCharacter(zPos, centerX) {
            giantGirlGroup = new THREE.Group();
            giantGirlGroup.position.set(centerX, 0, zPos);
            giantGirlGroup.scale.set(2.2, 2.2, 2.2);

            const dressGeo = new THREE.ConeGeometry(0.8, 1.6, 16);
            const dressMat = new THREE.MeshStandardMaterial({ color: 0xef4444 });
            girlBody = new THREE.Mesh(dressGeo, dressMat);
            girlBody.position.y = 1.3;
            giantGirlGroup.add(girlBody);

            const headGeo = new THREE.SphereGeometry(0.55, 20, 20);
            const skinMat = new THREE.MeshStandardMaterial({ color: 0xffdbac });
            girlHead = new THREE.Mesh(headGeo, skinMat);
            girlHead.position.y = 2.4;
            giantGirlGroup.add(girlHead);

            const armGeo = new THREE.CylinderGeometry(0.1, 0.1, 0.9, 10);
            girlArmL = new THREE.Mesh(armGeo, skinMat);
            girlArmL.position.set(-0.75, 1.7, 0);
            girlArmR = new THREE.Mesh(armGeo, skinMat);
            girlArmR.position.set(0.75, 1.7, 0);
            giantGirlGroup.add(girlArmL, girlArmR);

            scene.add(giantGirlGroup);
        }

        function spawnColorGate(centerX, zPos, targetColor) {
            const gateGroup = new THREE.Group();
            gateGroup.position.set(centerX, 0, zPos);

            const ringGeo = new THREE.TorusGeometry(2.4, 0.25, 16, 30);
            const ringMat = new THREE.MeshStandardMaterial({ color: targetColor.hex, emissive: targetColor.hex, emissiveIntensity: 0.4 });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.position.y = 1.6;
            gateGroup.add(ring);

            gateGroup.userData = { color: targetColor };
            scene.add(gateGroup);
            colorGates.push(gateGroup);
        }

        function spawnGlassCluster(zPos, currentColorTarget) {
            const pt = trackCurve.getPoint(zPos / trackLength);
            const positions = [-1.6, 0, 1.6];
            positions.forEach((xOffset, idx) => {
                const isMatch = (idx === 1);
                const colorObj = isMatch ? currentColorTarget : JUICE_COLORS[Math.floor(Math.random() * JUICE_COLORS.length)];

                const cupGroup = new THREE.Group();
                cupGroup.position.set(pt.x + xOffset, 0.9, zPos);

                const cupGeo = new THREE.CylinderGeometry(0.4, 0.26, 0.9, 14);
                const cupMat = new THREE.MeshStandardMaterial({ color: colorObj.hex });
                const cup = new THREE.Mesh(cupGeo, cupMat);
                cupGroup.add(cup);

                cupGroup.userData = { color: colorObj };
                scene.add(cupGroup);
                collectibles.push(cupGroup);
            });
        }

        function spawnStaticSpike(zPos) {
            const pt = trackCurve.getPoint(zPos / trackLength);
            const obstacle = new THREE.Group();
            obstacle.position.set(pt.x + (Math.random() - 0.5) * 3.0, 0.5, zPos);

            const spikeGeo = new THREE.ConeGeometry(0.45, 1.2, 8);
            const spikeMat = new THREE.MeshStandardMaterial({ color: 0xd97706 });
            const spike = new THREE.Mesh(spikeGeo, spikeMat);
            obstacle.add(spike);

            scene.add(obstacle);
            obstacles.push(obstacle);
        }

        function createJuiceGlassPlayer() {
            playerGroup = new THREE.Group();

            const glassGeo = new THREE.CylinderGeometry(0.7, 0.4, 1.8, 24, 1, true);
            const glassMat = new THREE.MeshPhysicalMaterial({
                color: 0xf8fafc, transparent: true, opacity: 0.45, roughness: 0.1, transmission: 0.85
            });
            glassMesh = new THREE.Mesh(glassGeo, glassMat);
            glassMesh.position.y = 1.1;
            playerGroup.add(glassMesh);

            const juiceGeo = new THREE.CylinderGeometry(0.66, 0.42, 1.6, 20);
            const juiceMat = new THREE.MeshStandardMaterial({ color: currentJuiceColor.hex });
            juiceLevelMesh = new THREE.Mesh(juiceGeo, juiceMat);
            glassMesh.add(juiceLevelMesh);

            scene.add(playerGroup);
        }

        function setupInput() {
            window.addEventListener('keydown', (e) => { if (e.key in keys) keys[e.key] = true; });
            window.addEventListener('keyup', (e) => { if (e.key in keys) keys[e.key] = false; });

            const onPointerDown = (e) => {
                if (!isPlaying) return;
                isDragging = true;
                prevTouchX = e.touches ? e.touches[0].clientX : e.clientX;
                AudioFX.init();
            };

            const onPointerMove = (e) => {
                if (!isDragging || !isPlaying) return;
                const currentX = e.touches ? e.touches[0].clientX : e.clientX;
                const deltaX = currentX - prevTouchX;
                prevTouchX = currentX;

                targetX += deltaX * 0.012;
                targetX = Math.max(-laneLimit, Math.min(laneLimit, targetX));
            };

            const onPointerUp = () => { isDragging = false; };

            window.addEventListener('mousedown', onPointerDown);
            window.addEventListener('mousemove', onPointerMove);
            window.addEventListener('mouseup', onPointerUp);
            window.addEventListener('touchstart', onPointerDown);
            window.addEventListener('touchmove', onPointerMove);
            window.addEventListener('touchend', onPointerUp);

            document.getElementById('restart-btn').addEventListener('click', () => startLevel(currentLevel));
            document.getElementById('next-level-btn').addEventListener('click', () => startLevel(currentLevel + 1));
        }

        function startLevel(levelNum) {
            AudioFX.init();
            currentLevel = Math.min(3, levelNum);
            isPlaying = true;
            isVictorious = false;
            danceDurationTimer = 0;
            juiceVolume = 100;
            playerPos = { x: 0, z: 0 };
            targetX = 0;
            hopTime = 0;

            currentJuiceColor = JUICE_COLORS[0];
            juiceLevelMesh.material.color.setHex(currentJuiceColor.hex);

            buildLevelWorld(currentLevel);

            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('next-level-btn').classList.add('hidden');
            document.getElementById('current-level-num').innerText = currentLevel;

            updateHUD();
        }

        function triggerVictory() {
            isPlaying = false;
            isVictorious = true;
            danceDurationTimer = 0;
            AudioFX.playWin();
        }

        function triggerGameOver() {
            isPlaying = false;
            AudioFX.playHit();
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('next-level-btn').classList.add('hidden');
        }

        function updateHUD() {
            document.getElementById('score-text').innerText = score;
            const progress = Math.min(100, Math.max(0, (playerPos.z / (trackLength - 15)) * 100));
            document.getElementById('progress-bar').style.width = `${progress}%`;
        }

        function createJuiceSplash(pos, colorHex) {
            for (let i = 0; i < 10; i++) {
                const pGeo = new THREE.SphereGeometry(0.12, 6, 6);
                const pMat = new THREE.MeshBasicMaterial({ color: colorHex });
                const p = new THREE.Mesh(pGeo, pMat);
                p.position.copy(pos);
                p.userData = {
                    velocity: new THREE.Vector3((Math.random() - 0.5) * 0.5, Math.random() * 0.5 + 0.2, (Math.random() - 0.5) * 0.5),
                    life: 1.0
                };
                scene.add(p);
                particles.push(p);
            }
        }

        function animate(timestamp) {
            requestAnimationFrame(animate);
            const delta = 0.016;

            if (isPlaying) {
                if (keys.ArrowLeft || keys.a) targetX -= 0.10;
                if (keys.ArrowRight || keys.d) targetX += 0.10;
                targetX = Math.max(-laneLimit, Math.min(laneLimit, targetX));

                playerPos.x += (targetX - playerPos.x) * 0.18;
                playerPos.z += forwardSpeed;

                // Get current winding track center position
                const currentTrackCenter = trackCurve.getPoint(Math.min(1, playerPos.z / trackLength));
                const actualX = currentTrackCenter.x + playerPos.x;

                hopTime += delta * hopFrequency;
                const hopY = Math.abs(Math.sin(hopTime)) * hopHeight;

                if (Math.sin(hopTime) < 0.1 && Math.sin(hopTime - delta * hopFrequency) >= 0.1) {
                    AudioFX.playHop();
                }

                playerGroup.position.set(actualX, hopY, playerPos.z);
                glassMesh.rotation.z = (actualX - (currentTrackCenter.x + targetX)) * 0.2;

                // Shorts vertical camera follow
                camera.position.set(currentTrackCenter.x * 0.4, 4.8 + hopY * 0.2, playerPos.z - 7.5);
                camera.lookAt(currentTrackCenter.x * 0.4, 1.6, playerPos.z + 5);

                const finishZ = trackLength - 15;
                if (playerPos.z >= finishZ) triggerVictory();

                // Check Gate collisions
                colorGates.forEach(gate => {
                    if (gate.visible && Math.abs(playerPos.z - gate.position.z) < 0.8) {
                        gate.visible = false;
                        currentJuiceColor = gate.userData.color;
                        juiceLevelMesh.material.color.setHex(currentJuiceColor.hex);
                        AudioFX.playColorGate();
                        createJuiceSplash(playerGroup.position, currentJuiceColor.hex);
                    }
                });

                // Check Collectibles
                collectibles.forEach(item => {
                    if (item.visible && Math.abs(playerPos.z - item.position.z) < 0.8 && Math.abs(actualX - item.position.x) < 0.9) {
                        item.visible = false;
                        if (item.userData.color.id === currentJuiceColor.id) {
                            AudioFX.playCollect();
                            score += 20;
                            createJuiceSplash(playerGroup.position, currentJuiceColor.hex);
                        } else {
                            AudioFX.playHit();
                            juiceVolume -= 25;
                            createJuiceSplash(playerGroup.position, 0xef4444);
                            if (juiceVolume <= 0) triggerGameOver();
                        }
                    }
                });

                // Check Obstacles
                obstacles.forEach(obs => {
                    if (Math.abs(playerPos.z - obs.position.z) < 0.8 && Math.abs(actualX - obs.position.x) < 0.9) {
                        obs.position.z -= 500;
                        AudioFX.playHit();
                        juiceVolume -= 30;
                        if (juiceVolume <= 0) triggerGameOver();
                    }
                });

                updateHUD();
            }

            // Extended 8 seconds Giant Girl Dance at Finish Line
            if (isVictorious && giantGirlGroup) {
                danceDurationTimer += delta;
                giantGirlJumpTime += delta * 12;
                
                const jumpY = Math.abs(Math.sin(giantGirlJumpTime)) * 1.6;
                giantGirlGroup.position.y = jumpY;
                giantGirlGroup.rotation.y += 0.04;

                girlArmL.rotation.z = Math.PI / 3 + Math.sin(giantGirlJumpTime) * 0.5;
                girlArmR.rotation.z = -Math.PI / 3 - Math.sin(giantGirlJumpTime) * 0.5;

                if (danceDurationTimer > 8.0) {
                    document.getElementById('game-over-screen').classList.remove('hidden');
                    if (currentLevel < 3) {
                        document.getElementById('next-level-btn').classList.remove('hidden');
                    }
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.position.add(p.userData.velocity);
                p.userData.life -= 0.04;
                p.scale.multiplyScalar(0.92);
                if (p.userData.life <= 0) {
                    scene.remove(p);
                    particles.splice(i, 1);
                }
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = init;
    </script>
