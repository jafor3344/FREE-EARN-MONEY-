<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Color Runner Boss Fight</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
            pointer-events: none;
            text-align: center;
        }
        #level-indicator {
            font-size: 18px;
            background: rgba(0,0,0,0.5);
            padding: 5px 15px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 5px;
        }
        #instructions {
            position: absolute;
            bottom: 40px;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 18px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            pointer-events: none;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
    </style>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="ui">
        <div id="level-indicator">Level 1</div>
        <div id="score">Score: 0</div>
    </div>
    <div id="instructions">আঙুল দিয়ে টেনে ডানে-বামে নিন এবং একই রঙের স্টিকম্যান ধরুন!</div>

    <script>
        // Game Variables
        let scene, camera, renderer;
        let player;
        let trackLength = 400;
        let gameSpeed = 0.3;
        let isRunning = false;
        let playerLevel = 1;
        let playerColor = 0x3498db; // Blue
        let score = 0;
        
        let collectibles = [];
        let obstacles = [];
        let boss = null;
        let gameState = 'RUNNING'; // RUNNING, BOSS_FIGHT, WON, LOST

        // Touch/Mouse Controls
        let touchX = 0;
        let targetX = 0;
        let isDragging = false;
        let previousMouseX = 0;

        init();
        animate();

        function init() {
            // Scene Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.FogExp2(0x87CEEB, 0.015);

            // Camera Setup
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 7, -10);
            camera.lookAt(0, 2, 5);

            // Renderer Setup
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(20, 40, -20);
            directionalLight.castShadow = true;
            scene.add(directionalLight);

            // Create Track
            createTrack();

            // Create Player
            player = createStickman(playerColor);
            player.position.set(0, 0, 0);
            scene.add(player);

            // Generate Level Objects
            generateCollectiblesAndObstacles();
            createBoss();

            // Event Listeners for Smooth Dragging
            window.addEventListener('resize', onWindowResize);
            
            document.addEventListener('mousedown', onPointerDown);
            document.addEventListener('mousemove', onPointerMove);
            document.addEventListener('mouseup', onPointerUp);

            document.addEventListener('touchstart', onPointerDown, { passive: false });
            document.addEventListener('touchmove', onPointerMove, { passive: false });
            document.addEventListener('touchend', onPointerUp);
        }

        function createTrack() {
            // Water background plane
            const waterGeo = new THREE.PlaneGeometry(1000, 1000);
            const waterMat = new THREE.MeshBasicMaterial({ color: 0x1e90ff });
            const water = new THREE.Mesh(waterGeo, waterMat);
            water.rotation.x = -Math.PI / 2;
            water.position.y = -0.5;
            scene.add(water);

            // Main Running Path
            const trackGeo = new THREE.BoxGeometry(6, 0.5, trackLength);
            const trackMat = new THREE.MeshStandardMaterial({ color: 0x3d3d3d, roughness: 0.8 });
            const track = new THREE.Mesh(trackGeo, trackMat);
            track.position.set(0, -0.25, trackLength / 2);
            track.receiveShadow = true;
            scene.add(track);

            // Side rails
            const railGeo = new THREE.BoxGeometry(0.3, 1, trackLength);
            const railMat = new THREE.MeshStandardMaterial({ color: 0x555555 });
            
            const leftRail = new THREE.Mesh(railGeo, railMat);
            leftRail.position.set(-3.15, 0.25, trackLength / 2);
            scene.add(leftRail);

            const rightRail = new THREE.Mesh(railGeo, railMat);
            rightRail.position.set(3.15, 0.25, trackLength / 2);
            scene.add(rightRail);
        }

        function createStickman(color) {
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.4 });

            // Head
            const headGeo = new THREE.SphereGeometry(0.3, 16, 16);
            const head = new THREE.Mesh(headGeo, mat);
            head.position.y = 1.4;
            head.castShadow = true;
            group.add(head);

            // Body
            const bodyGeo = new THREE.CylinderGeometry(0.15, 0.1, 0.8, 8);
            const body = new THREE.Mesh(bodyGeo, mat);
            body.position.y = 0.8;
            body.castShadow = true;
            group.add(body);

            // Limbs (Simple blocks)
            const limbGeo = new THREE.BoxGeometry(0.12, 0.7, 0.12);
            
            const leftArm = new THREE.Mesh(limbGeo, mat);
            leftArm.position.set(-0.3, 0.8, 0);
            group.add(leftArm);

            const rightArm = new THREE.Mesh(limbGeo, mat);
            rightArm.position.set(0.3, 0.8, 0);
            group.add(rightArm);

            const leftLeg = new THREE.Mesh(limbGeo, mat);
            leftLeg.position.set(-0.15, 0.2, 0);
            group.add(leftLeg);

            const rightLeg = new THREE.Mesh(limbGeo, mat);
            rightLeg.position.set(0.15, 0.2, 0);
            group.add(rightLeg);

            group.scale.set(1, 1, 1);
            return group;
        }

        function generateCollectiblesAndObstacles() {
            const colors = [0x3498db, 0xe74c3c, 0x2ecc71]; // Blue, Red, Green

            for (let z = 20; z < trackLength - 40; z += 15) {
                // Spawn Collectibles (Matching and different colors)
                for (let i = 0; i < 3; i++) {
                    const cColor = colors[Math.floor(Math.random() * colors.length)];
                    const item = createStickman(cColor);
                    const xPos = (i - 1) * 2;
                    item.position.set(xPos, 0, z + (Math.random() * 5));
                    item.userData = { type: 'collectible', color: cColor, collected: false };
                    scene.add(item);
                    collectibles.push(item);
                }

                // Spawn Obstacles
                if (Math.random() > 0.4) {
                    const obsGeo = new THREE.BoxGeometry(2, 1, 0.5);
                    const obsMat = new THREE.MeshStandardMaterial({ color: 0xff4757 });
                    const obstacle = new THREE.Mesh(obsGeo, obsMat);
                    const xPos = (Math.random() - 0.5) * 4;
                    obstacle.position.set(xPos, 0.5, z + 7);
                    obstacle.castShadow = true;
                    obstacle.userData = { type: 'obstacle' };
                    scene.add(obstacle);
                    obstacles.push(obstacle);
                }
            }
        }

        function createBoss() {
            boss = createStickman(0xff4757); // Red Boss
            boss.scale.set(3.5, 3.5, 3.5);
            boss.position.set(0, 0, trackLength - 10);
            scene.add(boss);
        }

        // Pointer / Touch Handlers for Smooth Movement
        function onPointerDown(e) {
            isDragging = true;
            isRunning = true;
            previousMouseX = e.clientX || e.touches[0].clientX;
        }

        function onPointerMove(e) {
            if (!isDragging || gameState !== 'RUNNING') return;

            const currentX = e.clientX || e.touches[0].clientX;
            const deltaX = currentX - previousMouseX;
            previousMouseX = currentX;

            targetX += deltaX * 0.02;
            // Limit within track bounds
            targetX = Math.max(-2.5, Math.min(2.5, targetX));
        }

        function onPointerUp() {
            isDragging = false;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Game Loop
        function animate() {
            requestAnimationFrame(animate);

            if (isRunning && gameState === 'RUNNING') {
                // Move player forward
                player.position.z += gameSpeed;

                // Smoothly interpolate player X position towards targetX
                player.position.x += (targetX - player.position.x) * 0.1;

                // Follow camera behind player
                camera.position.z = player.position.z - 10;
                camera.position.x = player.position.x * 0.5;

                // Collision detection with collectibles
                collectibles.forEach(item => {
                    if (!item.userData.collected && player.position.distanceTo(item.position) < 1.2) {
                        if (item.userData.color === playerColor) {
                            // Correct color match: Grow bigger!
                            playerLevel += 1;
                            score += 10;
                            const newScale = 1 + (playerLevel - 1) * 0.15;
                            player.scale.set(newScale, newScale, newScale);
                            
                            // Remove item
                            scene.remove(item);
                            item.userData.collected = true;
                        } else {
                            // Wrong color: Shrink or penalty
                            playerLevel = Math.max(1, playerLevel - 1);
                            const newScale = 1 + (playerLevel - 1) * 0.15;
                            player.scale.set(newScale, newScale, newScale);

                            scene.remove(item);
                            item.userData.collected = true;
                        }
                        document.getElementById('level-indicator').innerText = `Level ${playerLevel}`;
                        document.getElementById('score').innerText = `Score: ${score}`;
                    }
                });

                // Collision with obstacles
                obstacles.forEach(obs => {
                    if (player.position.distanceTo(obs.position) < 1.0) {
                        playerLevel = Math.max(1, playerLevel - 2);
                        const newScale = 1 + (playerLevel - 1) * 0.15;
                        player.scale.set(newScale, newScale, newScale);
                        obs.position.y = -10; // Hide obstacle after hit
                    }
                });

                // Check for Boss Fight trigger at the finish line
                if (player.position.z >= trackLength - 15) {
                    gameState = 'BOSS_FIGHT';
                    document.getElementById('instructions').innerText = 'ফাইনাল বস ফাইট শুরু হয়েছে!';
                }
            } 
            else if (gameState === 'BOSS_FIGHT') {
                // Move player towards boss for fight animation
                if (player.position.z < trackLength - 4) {
                    player.position.z += 0.1;
                    player.position.x += (0 - player.position.x) * 0.1;
                } else {
                    // Epic Fight Animation (Rotating / Clashing)
                    player.rotation.y += 0.2;
                    boss.rotation.y -= 0.2;

                    setTimeout(() => {
                        if (playerLevel >= 5) {
                            gameState = 'WON';
                            document.getElementById('instructions').innerText = 'অভিনন্দন! আপনি বসকে হারিয়ে জয়ী হয়েছেন! 🏆';
                            document.getElementById('instructions').style.color = '#2ecc71';
                        } else {
                            gameState = 'LOST';
                            document.getElementById('instructions').innerText = 'গেম ওভার! বসকে হারাতে লেভেল বাড়ান।';
                            document.getElementById('instructions').style.color = '#e74c3c';
                        }
                    }, 2000);
                    gameState = 'FINISHED';
                }
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
