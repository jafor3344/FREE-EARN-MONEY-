<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Gear Speed Car Racing</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: #111;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 405px;
            max-height: 720px;
            background: #222;
            box-shadow: 0 0 25px rgba(0,0,0,0.9);
            overflow: hidden;
            border: 4px solid #444;
            border-radius: 12px;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            text-align: center;
            padding: 20px;
        }
        h1 {
            color: #00ffcc;
            font-size: 28px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(0,255,204,0.6);
        }
        p {
            color: #ddd;
            font-size: 15px;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .btn {
            background: linear-gradient(135deg, #00ffcc, #0077ff);
            color: #111;
            border: none;
            padding: 14px 38px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0,255,204,0.4);
        }
        .ui-panel {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
            z-index: 5;
        }
        .gear-indicator {
            background: rgba(0,0,0,0.5);
            padding: 5px 12px;
            border-radius: 20px;
            border: 2px solid #00ffcc;
            color: #00ffcc;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div class="ui-panel">
        <div>স্কোর: <span id="scoreVal">0</span></div>
        <div class="gear-indicator">গিয়ার: <span id="gearVal">1</span></div>
    </div>
    <canvas id="gameCanvas"></canvas>

    <div id="overlay">
        <h1>GEAR SPEED RACING</h1>
        <p>আঙুল যেদিকে টানবেন গাড়ি সেদিকে যাবে!<br>স্ক্রিনে চেপে ধরে রাখলে সুপার বুস্ট (জোর) হবে।</p>
        <button class="btn" onclick="startGame()">রেস শুরু করুন</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    canvas.width = 405;
    canvas.height = 720;

    let gameState = 'START'; 
    let score = 0;
    let baseSpeed = 4;
    let roadSpeed = 4;
    let boostActive = false;
    let currentGear = 1;

    let playerCar = {
        x: canvas.width / 2 - 25,
        y: canvas.height - 130,
        width: 50,
        height: 90
    };

    let roadOffset = 0;
    let obstacles = [];

    // টাচ বা মাউস ড্র্যাগ কন্ট্রোল (যেদিকে আঙুল দেবেন গাড়ি সেদিকে যাবে)
    let isDragging = false;
    function handleMove(clientX) {
        if (gameState !== 'PLAYING') return;
        const rect = canvas.getBoundingClientRect();
        let x = (clientX - rect.left) * (canvas.width / rect.width);
        playerCar.x = x - playerCar.width / 2;
    }

    window.addEventListener('mousedown', () => { boostActive = true; currentGear = 2; document.getElementById('gearVal').innerText = '2 (BOOST)'; });
    window.addEventListener('mouseup', () => { boostActive = false; currentGear = 1; document.getElementById('gearVal').innerText = '1'; });

    window.addEventListener('touchstart', (e) => { 
        boostActive = true; 
        currentGear = 2; 
        document.getElementById('gearVal').innerText = '2 (BOOST)';
        handleMove(e.touches[0].clientX);
        e.preventDefault(); 
    }, { passive: false });

    window.addEventListener('touchend', () => { 
        boostActive = false; 
        currentGear = 1; 
        document.getElementById('gearVal').innerText = '1'; 
    });

    window.addEventListener('mousemove', (e) => { handleMove(e.clientX); });
    window.addEventListener('touchmove', (e) => { 
        handleMove(e.touches[0].clientX); 
        e.preventDefault(); 
    }, { passive: false });

    function startGame() {
        gameState = 'PLAYING';
        score = 0;
        obstacles = [];
        playerCar.x = canvas.width / 2 - 25;
        document.getElementById('overlay').style.display = 'none';
    }

    function gameOver() {
        gameState = 'GAMEOVER';
        document.getElementById('overlay').innerHTML = `
            <h1 style="color: #ff3333;">দুর্ঘটনা! গেম ওভার</h1>
            <p>আপনার মোট স্কোর: ${Math.floor(score)}</p>
            <button class="btn" onclick="startGame()">পুনরায় খেলুন</button>
        `;
        document.getElementById('overlay').style.display = 'flex';
    }

    function update() {
        if (gameState !== 'PLAYING') return;

        // গিয়ার ও বুস্ট অনুযায়ী স্পিড নির্ধারণ (চেপে ধরলে জোর বা স্পিড বেড়ে যাবে)
        roadSpeed = boostActive ? baseSpeed * 2.5 : baseSpeed;
        roadOffset += roadSpeed;
        score += roadSpeed * 0.1;
        document.getElementById('scoreVal').innerText = Math.floor(score);

        // রাস্তার সীমানার মধ্যে রাখা
        if (playerCar.x < 55) playerCar.x = 55;
        if (playerCar.x > canvas.width - 55 - player.width) playerCar.x = canvas.width - 55 - player.width;

        // বাধা বা বিপক্ষ গাড়ি তৈরি
        if (Math.random() < 0.03) {
            let laneX = [80, 175, 270][Math.floor(Math.random() * 3)];
            obstacles.push({
                x: laneX,
                y: -100,
                width: 50,
                height: 90,
                color: ['#ff3366', '#3366ff', '#9933ff', '#ff9900'][Math.floor(Math.random() * 4)]
            });
        }

        // বাধা আপডেট ও কলিশন চেক
        for (let i = obstacles.length - 1; i >= 0; i--) {
            obstacles[i].y += roadSpeed * 0.8;

            if (
                playerCar.x < obstacles[i].x + obstacles[i].width &&
                playerCar.x + playerCar.width > obstacles[i].x &&
                playerCar.y < obstacles[i].y + obstacles[i].height &&
                player.y + player.height > obstacles[i].y
            ) {
                gameOver();
            }

            if (obstacles[i].y > canvas.height) {
                obstacles.splice(i, 1);
            }
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // ঘাস ব্যাকগ্রাউন্ড
        ctx.fillStyle = '#1e7e34';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // রাস্তা
        ctx.fillStyle = '#333';
        ctx.fillRect(50, 0, canvas.width - 100, canvas.height);

        // বর্ডার
        ctx.fillStyle = '#fff';
        ctx.fillRect(45, 0, 8, canvas.height);
        ctx.fillRect(canvas.width - 53, 0, 8, canvas.height);

        // ডিভাইডার লাইন
        ctx.strokeStyle = '#f1c40f';
        ctx.lineWidth = 6;
        ctx.setLineDash([30, 30]);
        ctx.lineDashOffset = -roadOffset;
        ctx.beginPath();
        ctx.moveTo(canvas.width / 2, 0);
        ctx.lineTo(canvas.width / 2, canvas.height);
        ctx.stroke();
        ctx.setLineDash([]);

        // বাধা গাড়িগুলো ড্র
        for (let obs of obstacles) {
            ctx.fillStyle = obs.color;
            ctx.beginPath();
            ctx.roundRect(obs.x, obs.y, obs.width, obs.height, 10);
            ctx.fill();

            ctx.fillStyle = '#111';
            ctx.fillRect(obs.x + 8, obs.y + 15, obs.width - 16, 20);
        }

        // প্লেয়ার গাড়ি ড্র
        ctx.save();
        ctx.translate(playerCar.x + playerCar.width / 2, playerCar.y + playerCar.height / 2);
        if (boostActive) {
            ctx.fillStyle = '#00ffff';
            ctx.fillRect(-15, playerCar.height / 2, 30, 15);
        }

        ctx.fillStyle = '#ffcc00';
        ctx.beginPath();
        ctx.roundRect(-playerCar.width / 2, -playerCar.height / 2, playerCar.width, playerCar.height, 10);
        ctx.fill();

        ctx.fillStyle = '#111';
        ctx.fillRect(-playerCar.width / 2 + 8, -playerCar.height / 2 + 15, playerCar.width - 16, 20);
        ctx.restore();
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    loop();
</script>

</body>
</html>
