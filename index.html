
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Highway Rush V2</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#101820;color:white;
 font-family:Arial;text-align:center;
}
h2{color:#ffd43b;margin:10px}
.hud{
 display:flex;justify-content:space-around;
 padding:10px;font-weight:bold;
}
canvas{
 width:min(100%,420px);
 height:auto;background:#287b36;
 border:3px solid white;border-radius:10px;
 display:block;margin:auto;
 touch-action:pan-y;
}
.controls{
 display:flex;justify-content:center;
 gap:12px;margin:12px auto;max-width:420px;
}
button{
 padding:14px;border:0;border-radius:12px;
 background:#ffd43b;font-size:19px;
 font-weight:bold;flex:1;
}
#start{background:#16d98b}
</style>
</head>
<body>
<h2>🏎️ HIGHWAY RUSH V2</h2>

<div class="hud">
 <span>🏆 <b id="score">0</b></span>
 <span>🪙 <b id="coin">0</b></span>
 <span>LEVEL <b id="level">1</b></span>
</div>

<canvas id="game" width="400" height="650"></canvas>

<div class="controls">
 <button id="left">⬅</button>
 <button id="nitro">⚡ NITRO</button>
 <button id="right">➡</button>
</div>
<button id="start">START / RESTART</button>
<p id="status">Avoid traffic and collect coins!</p>

<script>
const cv=document.getElementById("game");
const ctx=cv.getContext("2d");

let player={lane:1,y:535};
let cars=[],rocks=[],money=[];
let score=0,coin=0,level=1;
let speed=4,frame=0,road=0;
let running=false,nitro=0;
let best=0;

const lanes=[75,175,275];

function car(x,y,color){
 ctx.fillStyle="#111";
 ctx.fillRect(x+2,y+8,9,17);
 ctx.fillRect(x+31,y+8,9,17);
 ctx.fillRect(x+2,y+49,9,17);
 ctx.fillRect(x+31,y+49,9,17);

 ctx.fillStyle=color;
 ctx.beginPath();
 ctx.roundRect(x+5,y,32,70,9);
 ctx.fill();

 ctx.fillStyle="#9eeaff";
 ctx.fillRect(x+10,y+12,22,18);
 ctx.fillRect(x+10,y+43,22,10);
 ctx.fillStyle="#fff";
 ctx.fillRect(x+8,y+63,8,4);
 ctx.fillRect(x+27,y+63,8,4);
}

function background(){
 ctx.fillStyle="#23783b";
 ctx.fillRect(0,0,400,650);

 // Trees
 for(let i=0;i<8;i++){
  let y=(i*100+road)%750-80;
  ctx.fillStyle="#704421";
  ctx.fillRect(17,y+15,8,20);
  ctx.fillStyle="#08652d";
  ctx.beginPath();
  ctx.arc(21,y,18,0,7);ctx.fill();
  ctx.fillStyle="#704421";
  ctx.fillRect(375,y+15,8,20);
  ctx.fillStyle="#08652d";
  ctx.beginPath();
  ctx.arc(379,y,18,0,7);ctx.fill();
 }

 ctx.fillStyle="#393939";
 ctx.fillRect(45,0,310,650);
 ctx.fillStyle="#fff";
 ctx.fillRect(43,0,3,650);
 ctx.fillRect(354,0,3,650);

 ctx.fillStyle="#ffdc39";
 for(let y=-80;y<700;y+=110)
  ctx.fillRect(195,y+road,9,55);

 road=(road+speed)%110;
}

function spawn(){
 if(frame%65===0){
  let lane=Math.floor(Math.random()*3);
  cars.push({
   lane,y:-90,
   color:["#09b9ff","#ffb000","#b95cff","#eeeeee"][Math.floor(Math.random()*4)]
  });
 }
 if(frame%110===0){
  rocks.push({lane:Math.floor(Math.random()*3),y:-40});
 }
 if(frame%80===0){
  money.push({lane:Math.floor(Math.random()*3),y:-30});
 }
}

function collision(y1,y2){
 return Math.abs(y1-y2)<55;
}

function update(){
 frame++;
 score++;
 level=1+Math.floor(score/500);
 speed=4+level*.6+(nitro>0?5:0);

 if(nitro>0)nitro--;

 spawn();

 cars.forEach(o=>{
  o.y+=speed;
  if(o.lane===player.lane&&collision(player.y,o.y))
   gameOver();
 });

 rocks.forEach(o=>{
  o.y+=speed;
  if(o.lane===player.lane&&collision(player.y,o.y))
   gameOver();
 });

 money.forEach(o=>{
  o.y+=speed;
  if(o.lane===player.lane&&collision(player.y,o.y)){
   o.y=1000;coin++;
  }
 });

 cars=cars.filter(o=>o.y<700);
 rocks=rocks.filter(o=>o.y<700);
 money=money.filter(o=>o.y<700);

 document.getElementById("score").textContent=score;
 document.getElementById("coin").textContent=coin;
 document.getElementById("level").textContent=level;
}

function draw(){
 background();

 cars.forEach(o=>car(lanes[o.lane],o.y,o.color));

 rocks.forEach(o=>{
  ctx.fillStyle="#aaa";
  ctx.beginPath();
  ctx.moveTo(lanes[o.lane]+3,o.y+35);
  ctx.lineTo(lanes[o.lane]+18,o.y);
  ctx.lineTo(lanes[o.lane]+44,o.y+10);
  ctx.lineTo(lanes[o.lane]+48,o.y+38);
  ctx.closePath();ctx.fill();
 });

 money.forEach(o=>{
  ctx.fillStyle="#ffd700";
  ctx.beginPath();
  ctx.arc(lanes[o.lane]+21,o.y,13,0,7);
  ctx.fill();
  ctx.fillStyle="#7b4d00";
  ctx.font="bold 15px Arial";
  ctx.fillText("$",lanes[o.lane]+16,o.y+5);
 });

 car(lanes[player.lane],player.y,
  nitro>0?"#00e5ff":"#ff3030");

 if(nitro>0){
  ctx.fillStyle="#00e5ff";
  ctx.fillRect(lanes[player.lane]+16,610,10,20);
 }
}

function loop(){
 if(!running)return;
 update();
 if(!running)return;
 draw();
 requestAnimationFrame(loop);
}

function gameOver(){
 running=false;
 document.getElementById("status").innerHTML=
 "💥 GAME OVER | Score: "+score+" | Coins: "+coin;
}

function startGame(){
 player.lane=1;
 cars=[];rocks=[];money=[];
 score=0;coin=0;level=1;
 speed=4;frame=0;road=0;nitro=0;
 running=true;
 document.getElementById("status").textContent="🏁 Race Started!";
 loop();
}

function move(d){
 if(running)player.lane=Math.max(0,Math.min(2,player.lane+d));
}

document.getElementById("left").onclick=()=>move(-1);
document.getElementById("right").onclick=()=>move(1);
document.getElementById("nitro").onclick=()=>{
 if(running)nitro=100;
};
document.getElementById("start").onclick=startGame;

let touchStart=0;
cv.addEventListener("touchstart",e=>{
 touchStart=e.touches[0].clientX;
},{passive:true});
cv.addEventListener("touchend",e=>{
 let dx=e.changedTouches[0].clientX-touchStart;
 if(Math.abs(dx)>25)move(dx>0?1:-1);
},{passive:true});

background();
car(lanes[1],535,"#ff3030");
</script>
</body>
</html>
