<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Maze Dash - Cute Cat Edition</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: #111;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        /* ইউটিউব শর্টসের জন্য নিখুঁত ৯:১৬ ফ্রেম এবং ছবির মতো ব্যাকগ্রাউন্ড */
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 405px;
            max-height: 720px;
            background: #e6953b;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            overflow: hidden;
            border: 4px solid #b86b20;
            border-radius: 12px;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            text-align: center;
            padding: 20px;
        }
        h1 {
            color: #ffcc00;
            font-size: 28px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255,204,0,0.5);
        }
        p {
            color: #eee;
            font-size: 15px;
            margin-bottom: 25px;
            line-height: 1.4;
        }
        .btn {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
            border: none;
            padding: 12px 35px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 65, 108, 0.4);
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div id="overlay">
        <h1>MAZE ESCAPE</h1>
        <p>স্ক্রিনে আঙুল দিয়ে বিড়ালটি টেনে নিন[span_2](start_span)[span_2](end_span)!<br>করাত ও বাধা এড়িয়ে ফিনিশ লাইনে পৌঁছান[span_3](start_span)[span_3](end_span)。</p>
        <button class="btn" onclick="startGame()">প্লে করুন</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    canvas.width = 405;
    canvas.height = 720;

    let gameState = 'START'; 

    // প্লেয়ার (ছবির স্টাইলে বক্সের ভেতর ইউনিক কিউট বিড়াল)
    let player = {
        x: 350,
        y: 130,
        size: 38,
        isDragging: false
    };

    // ছবির সাথে হুবহু মিল রেখে পাথরের ব্লক ও দেওয়ালসমূহ[span_4](start_span)[span_4](end_span)
    let walls = [
        { x: 0, y: 0, w: 405, h: 40 },
        { x: 0, y: 220, w: 280, h: 40 },
        { x: 120, y: 400, w: 285, h: 40 },
        { x: 0, y: 560, w: 220, h: 40 },
        { x: 120, y: 220, w: 40, h: 380 },
        { x: 280, y: 400, w: 40, h: 320 }
    ];

    // ছবির মতো বড় বড় ঘূর্ণমান করাত বাধা (Saw Blades)[span_5](start_span)[span_5](end_span)
    let hazards = [
        { x: 100, y: 130, radius: 28, angle: 0, speed: 0.1 },
        { x: 220, y: 130, radius: 28, angle: 0, speed: -0.12 }
    ];

    // ফিনিশিং লাইন (শেষ গোল্ডেন পয়েন্ট)
    let finishLine = {
        x: 40,
        y: 640,
        width: 60,
        height: 50
    };

    function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.clientX || (e.touches ? e.touches[0].clientX : 0);
        const clientY = e.clientY || (e.touches ? e.touches[0].clientY : 0);
        return {
            x: (clientX - rect.left) * (canvas.width / rect.width),
            y: (clientY - rect.top) * (canvas.height / rect.height)
        };
    }

    canvas.addEventListener('mousedown', startDrag);
    canvas.addEventListener('mousemove', dragMove);
    canvas.addEventListener('mouseup', endDrag);

    canvas.addEventListener('touchstart', (e) => { startDrag(e); e.preventDefault(); }, { passive: false });
    canvas.addEventListener('touchmove', (e) => { dragMove(e); e.preventDefault(); }, { passive: false });
    canvas.addEventListener('touchend', endDrag);

    function startDrag(e) {
        if (gameState !== 'PLAYING') return;
        const pos = getPos(e);
        if (
            pos.x > player.x - player.size/2 - 10 &&
            pos.x < player.x + player.size/2 + 10 &&
            pos.y > player.y - player.size/2 - 10 &&
            pos.y < player.y + player.size/2 + 10
        ) {
            player.isDragging = true;
        }
    }

    function dragMove(e) {
        if (!player.isDragging || gameState !== 'PLAYING') return;
        const pos = getPos(e);
        player.x = pos.x;
        player.y = pos.y;

        // বর্ডারের ভেতরে রাখা
        let half = player.size / 2;
        if (player.x < half) player.x = half;
        if (player.x > canvas.width - half) player.x = canvas.width - half;
        if (player.y < half) player.y = half;
        if (player.y > canvas.height - half) player.y = canvas.height - half;
    }

    function endDrag() {
        player.isDragging = false;
    }

    function startGame() {
        gameState = 'PLAYING';
        player.x = 350;
        player.y = 130;
        document.getElementById('overlay').style.display = 'none';
    }

    function gameOver() {
        gameState = 'GAMEOVER';
        document.getElementById('overlay').innerHTML = `
            <h1 style="color: #ff3333;">আরে না! কাটা পড়েছেন!</h1>
            <p>আবার চেষ্টা করুন[span_6](start_span)[span_6](end_span)!</p>
            <button class="btn" onclick="startGame()">পুনরায় চেষ্টা</button>
        `;
        document.getElementById('overlay').style.display = 'flex';
    }

    function winGame() {
        gameState = 'WIN';
        document.getElementById('overlay').innerHTML = `
            <h1 style="color: #00ffcc;">অভিনন্দন! জয়ী হয়েছেন[span_7](start_span)[span_7](end_span)!</h1>
            <p>সফলভাবে ফিনিশ লাইনে পৌঁছেছেন[span_8](start_span)[span_8](end_span)。</p>
            <button class="btn" onclick="startGame()">আবার খেলুন</button>
        `;
        document.getElementById('overlay').style.display = 'flex';
    }

    function update() {
        if (gameState !== 'PLAYING') return;

        let half = player.size / 2;
        // দেওয়াল বা ব্লকের সাথে সংঘর্ষ চেক[span_9](start_span)[span_9](end_span)
        for (let w of walls) {
            if (
                player.x + half > w.x &&
                player.x - half < w.x + w.w &&
                player.y + half > w.y &&
                player.y - half < w.y + w.h
            ) {
                gameOver();
            }
        }

        // ঘূর্ণমান করাতের সাথে ধাক্কা চেক[span_10](start_span)[span_10](end_span)
        for (let h of hazards) {
            h.angle += h.speed;
            const dist = Math.hypot(player.x - h.x, player.y - h.y);
            if (dist < half + h.radius - 8) {
                gameOver();
            }
        }

        // ফিনিশ লাইন চেক[span_11](start_span)[span_11](end_span)
        if (
            player.x > finishLine.x &&
            player.x < finishLine.x + finishLine.width &&
            player.y > finishLine.y &&
            player.y < finishLine.y + finishLine.height
        ) {
            winGame();
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // পাথরের টেক্সচারযুক্ত দেওয়াল বা ব্লক[span_12](start_span)[span_12](end_span)
        ctx.fillStyle = '#3e4a59';
        for (let w of walls) {
            ctx.fillRect(w.x, w.y, w.w, w.h);
            ctx.strokeStyle = '#5a6b82';
            ctx.lineWidth = 3;
            ctx.strokeRect(w.x, w.y, w.w, w.h);
        }

        // ফিনিশ লাইন (গোল্ডেন জোন)[span_13](start_span)[span_13](end_span)
        ctx.fillStyle = '#ffcc00';
        ctx.fillRect(finishLine.x, finishLine.y, finishLine.width, finishLine.height);
        ctx.fillStyle = '#000';
        ctx.font = 'bold 12px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('FINISH', finishLine.x + finishLine.width / 2, finishLine.y + 30);

        // ঘূর্ণমান করাত বাধা (Saw Blades)[span_14](start_span)[span_14](end_span)
        for (let h of hazards) {
            ctx.save();
            ctx.translate(h.x, h.y);
            ctx.rotate(h.angle);

            ctx.fillStyle = '#99aab8';
            ctx.beginPath();
            ctx.arc(0, 0, h.radius, 0, Math.PI * 2);
            ctx.fill();

            // করাতের দাঁতগুলো[span_15](start_span)[span_15](end_span)
            ctx.fillStyle = '#fff';
            for (let i = 0; i < 8; i++) {
                ctx.rotate(Math.PI / 4);
                ctx.fillRect(-3, -h.radius - 6, 6, 7);
            }
            ctx.restore();
        }

        // প্লেয়ার: ছবির মতো কাঁচের বাবল ও ইউনিক কিউট বিড়াল ক্যারেক্টার[span_16](start_span)[span_16](end_span)
        ctx.save();
        ctx.translate(player.x, player.y);

        // বাবল গ্লো
        ctx.beginPath();
        ctx.arc(0, 0, (player.size/2) + 4, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(0, 204, 255, 0.8)';
        ctx.lineWidth = 3;
        ctx.stroke();

        // বিড়ালের ব্যাকগ্রাউন্ড বক্স বা বৃত্ত
        ctx.fillStyle = '#222';
        ctx.fillRect(-player.size/2, -player.size/2, player.size, player.size);
        ctx.strokeStyle = '#ffcc00';
        ctx.lineWidth = 2;
        ctx.strokeRect(-player.size/2, -player.size/2, player.size, player.size);

        // বিড়ালের ফেস ও কান (অন্য কার্টুনের সাথে মিল নেই এমন ইউনিক ডিজাইন)
        ctx.fillStyle = '#b0bec5'; // গ্রে কালার বিড়াল
        ctx.beginPath();
        ctx.arc(0, 2, 14, 0, Math.PI * 2);
        ctx.fill();

        // কান দুটি
        ctx.beginPath();
        ctx.moveTo(-12, -6);
        ctx.lineTo(-18, -18);
        ctx.lineTo(-4, -12);
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(12, -6);
        ctx.lineTo(18, -18);
        ctx.lineTo(4, -12);
        ctx.fill();

        // বড় গোল গোল চোখ
        ctx.fillStyle = '#ffeb3b';
        ctx.beginPath();
        ctx.arc(-5, 0, 4.5, 0, Math.PI * 2);
        ctx.arc(5, 0, 4.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(-5, 0, 2, 0, Math.PI * 2);
        ctx.arc(5, 0, 2, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    loop();
</script>

</body>
</html>
