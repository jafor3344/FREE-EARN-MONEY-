<html style="margin:0;padding:0;background:#050b14;">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  var s=document.createElement('style');
  s.textContent='#gameWrap{user-select:none;-webkit-user-select:none;touch-action:none;font-family:"Poppins",sans-serif} .ctl-btn{touch-action:none;transition:transform .08s ease,filter .08s ease} .ctl-btn.pressed{transform:scale(.9);filter:brightness(1.25)} #overlay{backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}';
  document.head.appendChild(s);
})();
</script>
<div style="background:#050b14;padding:0;box-sizing:border-box;display:flex;justify-content:center;align-items:center;height:100vh;width:100vw;overflow:hidden;">
  <div id="gameWrap" style="position:relative;max-width:405px;width:100%;height:100vh;max-height:720px;overflow:hidden;background:#0b1622;box-sizing:border-box;">

    <!-- 3D canvas host -->
    <div id="canvasHost" style="position:relative;width:100%;height:100%;overflow:hidden;"></div>

    <!-- Minimalist HUD Corner Display (English) -->
    <div style="position:absolute;top:12px;right:12px;display:flex;flex-direction:column;gap:6px;z-index:5;pointer-events:none;align-items:flex-end;">
      <div style="background:rgba(5,15,25,0.75);border:1px solid rgba(255,255,255,0.15);backdrop-filter:blur(6px);border-radius:10px;padding:6px 12px;color:#fff;text-align:right;min-width:95px;box-shadow:0 4px 15px rgba(0,0,0,0.3);">
        <div style="font-size:9px;color:#38bdf8;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;">SPEED</div>
        <div style="font-size:16px;font-weight:800;line-height:1.1;"><span id="speedVal">0</span><span style="font-size:9px;color:#94a3b8;font-weight:500;"> KM/H</span></div>
      </div>
      <div style="background:rgba(5,15,25,0.75);border:1px solid rgba(255,255,255,0.15);backdrop-filter:blur(6px);border-radius:10px;padding:6px 12px;color:#fff;text-align:right;min-width:95px;box-shadow:0 4px 15px rgba(0,0,0,0.3);">
        <div style="font-size:9px;color:#38bdf8;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;">DISTANCE</div>
        <div style="font-size:16px;font-weight:800;line-height:1.1;"><span id="distVal">0</span><span style="font-size:9px;color:#94a3b8;font-weight:500;"> M</span></div>
      </div>
      <div style="background:rgba(5,15,25,0.75);border:1px solid rgba(251,191,36,0.3);backdrop-filter:blur(6px);border-radius:10px;padding:6px 12px;color:#fbbf24;text-align:right;min-width:95px;box-shadow:0 4px 15px rgba(0,0,0,0.3);">
        <div style="font-size:9px;color:#f59e0b;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;">LEVEL</div>
        <div style="font-size:16px;font-weight:800;line-height:1.1;" id="levelVal">1</div>
      </div>
    </div>

    <!-- start / gameover overlay -->
    <div id="overlay" style="position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(3,8,15,0.85);">
      <div id="readyPanel" style="text-align:center;color:#fff;padding:24px;max-width:300px;">
        <div style="width:64px;height:64px;margin:0 auto 16px;border-radius:20px;background:linear-gradient(135deg,#0ea5e9,#2563eb);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 25px rgba(37,99,235,0.5);">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h14M6 17l1.5-5h9L18 17M7 14h10M8 17v2M16 17v2"/><circle cx="8" cy="17" r="1.2" fill="#fff"/><circle cx="16" cy="17" r="1.2" fill="#fff"/></svg>
        </div>
        <h1 style="font-size:24px;font-weight:800;margin-bottom:6px;letter-spacing:-0.02em;">TURBO HIGHWAY 3D</h1>
        <p style="font-size:12px;color:#94a3b8;margin-bottom:20px;">Endless 3D Racing Challenge for Shorts</p>
        <button id="startBtn" class="ctl-btn" style="background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;font-size:16px;font-weight:700;padding:12px 40px;border-radius:30px;border:none;box-shadow:0 8px 25px rgba(34,197,94,0.45);cursor:pointer;width:100%;">TAP TO START</button>
      </div>
      
      <div id="overPanel" style="text-align:center;color:#fff;padding:24px;max-width:300px;display:none;">
        <div style="width:64px;height:64px;margin:0 auto 16px;border-radius:20px;background:linear-gradient(135deg,#ef4444,#b91c1c);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 25px rgba(239,68,68,0.5);">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
        </div>
        <h1 style="font-size:22px;font-weight:800;margin-bottom:6px;">CRASHED!</h1>
        <div style="display:flex;gap:10px;justify-content:center;margin:16px 0;">
          <div style="background:rgba(255,255,255,0.06);border-radius:12px;padding:10px;flex:1;border:1px solid rgba(255,255,255,0.08);">
            <div style="font-size:9px;color:#94a3b8;font-weight:600;">DISTANCE</div>
            <div style="font-size:18px;font-weight:800;" id="finalDist">0 m</div>
          </div>
          <div style="background:rgba(251,191,36,0.1);border:1px solid rgba(251,191,36,0.25);border-radius:12px;padding:10px;flex:1;color:#fbbf24;">
            <div style="font-size:9px;color:#f59e0b;font-weight:600;">LEVEL REACHED</div>
            <div style="font-size:18px;font-weight:800;" id="finalLevel">1</div>
          </div>
        </div>
        <div style="font-size:12px;color:#94a3b8;margin-bottom:20px;">Best Score: <span id="bestScore" style="font-weight:700;color:#fff;">0</span></div>
        <button id="restartBtn" class="ctl-btn" style="background:linear-gradient(135deg,#0ea5e9,#2563eb);color:#fff;font-size:15px;font-weight:700;padding:12px 32px;border-radius:30px;border:none;box-shadow:0 8px 25px rgba(14,165,233,0.45);cursor:pointer;width:100%;">PLAY AGAIN</button>
      </div>
    </div>

    <!-- touch control bar -->
    <div id="controlBar" style="position:absolute;bottom:0;left:0;right:0;height:95px;background:linear-gradient(180deg,rgba(13,27,42,0),rgba(13,27,42,0.95) 40%,#0a1420);display:flex;align-items:center;justify-content:space-around;box-sizing:border-box;padding:0 16px;z-index:6;">
      <button id="btnLeft" class="ctl-btn" style="width:58px;height:58px;border-radius:50%;background:rgba(30,58,95,0.8);border:2px solid rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;backdrop-filter:blur(4px);">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="#fff"><path d="M15 5l-7 7 7 7z"/></svg>
      </button>
      <button id="btnRight" class="ctl-btn" style="width:58px;height:58px;border-radius:50%;background:rgba(30,58,95,0.8);border:2px solid rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;backdrop-filter:blur(4px);">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="#fff"><path d="M9 5l7 7-7 7z"/></svg>
      </button>
      <button id="btnBrake" class="ctl-btn" style="width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#ef4444,#b91c1c);border:2px solid rgba(255,255,255,0.25);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;box-shadow:0 4px 12px rgba(239,68,68,0.4);">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M6 9l6 7 6-7z"/></svg>
      </button>
      <button id="btnGo" class="ctl-btn" style="width:68px;height:68px;border-radius:50%;background:linear-gradient(135deg,#22c55e,#15803d);border:3px solid rgba(255,255,255,0.3);color:#fff;font-size:16px;font-weight:800;cursor:pointer;padding:0;box-shadow:0 6px 18px rgba(34,197,94,0.45);letter-spacing:0.05em;">GO</button>
    </div>
  </div>
</div>

<script>
(function(){
  var wrap=document.getElementById('gameWrap');
  var host=document.getElementById('canvasHost');
  var speedVal=document.getElementById('speedVal');
  var distVal=document.getElementById('distVal');
  var levelVal=document.getElementById('levelVal');
  var overlay=document.getElementById('overlay');
  var readyPanel=document.getElementById('readyPanel');
  var overPanel=document.getElementById('overPanel');

  function rand(a,b){return a+Math.random()*(b-a);}
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

  var W=405,H=720;
  function sizeIt(){
    W=wrap.clientWidth||405;
    H=wrap.clientHeight||720;
    if(rdr){rdr.setSize(W,H);cam.aspect=W/H;cam.updateProjectionMatrix();}
  }

  if(typeof THREE==='undefined'){
    var n=0;var iv=setInterval(function(){n++;if(typeof THREE!=='undefined'){clearInterval(iv);init();}else if(n>40){clearInterval(iv);host.innerHTML='<div style="color:#fff;padding:40px;text-align:center;">3D Library Load Failed</div>';}},250);
    return;
  }

  var scene,cam,rdr,car,wheels=[],roadTex,grassTex,trees=[],obstacles=[],finishLineMesh,particles=[];
  var state='ready',speed=12,dist=0,level=1,best=0,carX=0,steer=0,spawnTimer=0.8,shake=0,clock=0;
  var input={left:false,right:false,accel:false,brake:false};
  try{best=parseInt(localStorage.getItem('turbo3d_best_shorts')||'0',10)||0;}catch(e){}

  function canvasTex(w,h,draw){var c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);var t=new THREE.CanvasTexture(c);return t;}

  function init(){
    scene=new THREE.Scene();
    var fogCol=0x0a1622;
    scene.fog=new THREE.Fog(fogCol,25,180);
    scene.background=new THREE.Color(fogCol);

    cam=new THREE.PerspectiveCamera(58,W/H,0.1,500);
    cam.position.set(0,3.8,7.5);

    rdr=new THREE.WebGLRenderer({antialias:true});
    rdr.setSize(W,H);
    rdr.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
    rdr.shadowMap.enabled=true;
    rdr.shadowMap.type=THREE.PCFSoftShadowMap;
    host.appendChild(rdr.domElement);

    // lights
    scene.add(new THREE.HemisphereLight(0xbfe3ff,0x3a5a2f,0.9));
    var sun=new THREE.DirectionalLight(0xfff4e0,1.2);
    sun.position.set(20,35,10);
    sun.castShadow=true;
    sun.shadow.mapSize.set(1024,1024);
    sun.shadow.camera.left=-18;sun.shadow.camera.right=18;sun.shadow.camera.top=15;sun.shadow.camera.bottom=-25;sun.shadow.camera.near=1;sun.shadow.camera.far=90;
    scene.add(sun);

    // sky dome
    var skyTex=canvasTex(64,256,function(ctx,w,h){var g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,'#050b14');g.addColorStop(.4,'#0b223f');g.addColorStop(.75,'#1a4b7c');g.addColorStop(1,'#4a8bc2');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);});
    var sky=new THREE.Mesh(new THREE.SphereGeometry(250,24,16),new THREE.MeshBasicMaterial({map:skyTex,side:THREE.BackSide,fog:false}));
    scene.add(sky);

    // ground
    grassTex=canvasTex(128,128,function(ctx,w,h){ctx.fillStyle='#2c5c22';ctx.fillRect(0,0,w,h);for(var i=0;i<400;i++){ctx.fillStyle=Math.random()<.5?'rgba(20,50,15,0.3)':'rgba(70,140,50,0.2)';ctx.fillRect(Math.random()*w,Math.random()*h,2,2);}});
    grassTex.wrapS=grassTex.wrapT=THREE.RepeatWrapping;grassTex.repeat.set(10,50);
    var ground=new THREE.Mesh(new THREE.PlaneGeometry(400,400),new THREE.MeshLambertMaterial({map:grassTex}));
    ground.rotation.x=-Math.PI/2;ground.position.set(0,-0.03,-80);ground.receiveShadow=true;scene.add(ground);

    // road
    roadTex=canvasTex(128,128,function(ctx,w,h){ctx.fillStyle='#222730';ctx.fillRect(0,0,w,h);ctx.fillStyle='#e2e8f0';ctx.fillRect(4,0,3,h);ctx.fillRect(w-7,0,3,h);ctx.fillStyle='#cbd5e1';for(var y=0;y<h;y+=30){ctx.fillRect(w/2-2,y,4,16);}});
    roadTex.wrapT=THREE.RepeatWrapping;roadTex.wrapS=THREE.ClampToEdgeWrapping;roadTex.repeat.set(1,40);
    var road=new THREE.Mesh(new THREE.PlaneGeometry(8.5,350),new THREE.MeshLambertMaterial({map:roadTex}));
    road.rotation.x=-Math.PI/2;road.position.set(0,0,-160);road.receiveShadow=true;scene.add(road);

    // finish line marker (Checkered stripe across road)
    var finishTex=canvasTex(128,32,function(ctx,w,h){for(var x=0;x<w;x+=16){ctx.fillStyle=(x/16)%2===0?'#ffffff':'#111111';ctx.fillRect(x,0,16,h);}});
    finishTex.wrapS=THREE.RepeatWrapping;finishTex.repeat.set(2,1);
    finishLineMesh=new THREE.Mesh(new THREE.PlaneGeometry(8.5,1.2),new THREE.MeshBasicMaterial({map:finishTex}));
    finishLineMesh.rotation.x=-Math.PI/2;finishLineMesh.position.set(0,0.01,-120);finishLineMesh.visible=false;scene.add(finishLineMesh);

    // materials
    var matTrunk=new THREE.MeshLambertMaterial({color:0x5c4033});
    var matPine=new THREE.MeshLambertMaterial({color:0x1b4d2e,flatShading:true});
    var matBlue=new THREE.MeshLambertMaterial({color:0x0284c7});
    var matBlueDark=new THREE.MeshLambertMaterial({color:0x0369a1});
    var matGlass=new THREE.MeshLambertMaterial({color:0x0f172a});
    var matWheel=new THREE.MeshLambertMaterial({color:0x1e293b});
    var matHub=new THREE.MeshLambertMaterial({color:0x94a3b8});
    var matHead=new THREE.MeshBasicMaterial({color:0xfef08a});
    var matTail=new THREE.MeshBasicMaterial({color:0xef4444});
    var matCone=new THREE.MeshLambertMaterial({color:0xf97316,flatShading:true});
    var matConeW=new THREE.MeshLambertMaterial({color:0xffffff});
    var trafficCols=[0xdc2626,0xca8a04,0x0d9488,0x7c3aed,0x475569];

    // player car
    car=new THREE.Group();
    var body=new THREE.Mesh(new THREE.BoxGeometry(1.6,0.5,3.2),matBlue);body.position.y=0.5;body.castShadow=true;car.add(body);
    var hood=new THREE.Mesh(new THREE.BoxGeometry(1.5,0.26,0.9),matBlueDark);hood.position.set(0,0.75,-1.0);hood.castShadow=true;car.add(hood);
    var cabin=new THREE.Mesh(new THREE.BoxGeometry(1.35,0.5,1.5),matBlue);cabin.position.set(0,0.98,0.1);cabin.castShadow=true;car.add(cabin);
    var glass=new THREE.Mesh(new THREE.BoxGeometry(1.28,0.36,1.3),matGlass);glass.position.set(0,1.02,0.1);car.add(glass);
    for(var i=0;i<4;i++){var wx=i%2?0.85:-0.85,wz=i<2?-1.0:1.0;var wh=new THREE.Mesh(new THREE.CylinderGeometry(0.32,0.32,0.24,12),matWheel);wh.rotation.z=Math.PI/2;wh.position.set(wx,0.32,wz);wh.castShadow=true;car.add(wh);wheels.push(wh);var hub=new THREE.Mesh(new THREE.CylinderGeometry(0.14,0.14,0.26,8),matHub);hub.rotation.z=Math.PI/2;hub.position.set(wx,0.32,wz);car.add(hub);}
    var hl1=new THREE.Mesh(new THREE.BoxGeometry(0.25,0.15,0.1),matHead);hl1.position.set(-0.5,0.52,-1.62);car.add(hl1);
    var hl2=hl1.clone();hl2.position.x=0.5;car.add(hl2);
    var tl1=new THREE.Mesh(new THREE.BoxGeometry(0.25,0.15,0.1),matTail);tl1.position.set(-0.5,0.52,1.62);car.add(tl1);
    var tl2=tl1.clone();tl2.position.x=0.5;car.add(tl2);
    car.position.set(0,0,0);scene.add(car);

    // trees pool
    function makeTree(){var g=new THREE.Group();var tr=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.15,0.6,5),matTrunk);tr.position.y=0.3;g.add(tr);var c1=new THREE.Mesh(new THREE.ConeGeometry(0.65,1.2,5),matPine);c1.position.y=1.0;g.add(c1);return g;}
    for(var i=0;i<28;i++){var t=makeTree();var side=Math.random()<.5;t.position.set(side?rand(-15,-7):rand(7,15),0,rand(-180,10));var sc=rand(0.8,1.3);t.scale.set(sc,sc,sc);scene.add(t);trees.push({m:t,side:side});}

    // obstacles pool
    function makeCone(){var g=new THREE.Group();var base=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.06,0.5),matConeW);base.position.y=0.03;g.add(base);var c=new THREE.Mesh(new THREE.ConeGeometry(0.3,0.75,8),matCone);c.position.y=0.42;g.add(c);g.traverse(function(o){if(o.isMesh)o.castShadow=true;});return g;}
    function makeTraffic(col){var g=new THREE.Group();var mcol=new THREE.MeshLambertMaterial({color:col});var b=new THREE.Mesh(new THREE.BoxGeometry(1.5,0.45,2.8),mcol);b.position.y=0.5;b.castShadow=true;g.add(b);var cab=new THREE.Mesh(new THREE.BoxGeometry(1.25,0.4,1.3),mcol);cab.position.set(0,0.9,0.08);cab.castShadow=true;g.add(cab);var gl=new THREE.Mesh(new THREE.BoxGeometry(1.18,0.32,1.1),matGlass);gl.position.set(0,0.93,0.08);g.add(gl);for(var i=0;i<4;i++){var wx=i%2?0.72:-0.72,wz=i<2?-0.9:0.9;var wh=new THREE.Mesh(new THREE.CylinderGeometry(0.28,0.28,0.22,8),matWheel);wh.rotation.z=Math.PI/2;wh.position.set(wx,0.28,wz);g.add(wh);}return g;}
    for(var i=0;i<6;i++){var g=makeCone();g.visible=false;scene.add(g);obstacles.push({g:g,type:'cone',halfW:0.4,own:0,active:false,x:0});}
    for(var i=0;i<5;i++){var g=makeTraffic(trafficCols[i%trafficCols.length]);g.visible=false;scene.add(g);obstacles.push({g:g,type:'car',halfW:0.9,own:0.4,active:false,x:0});}

    // particles pool
    for(var i=0;i<20;i++){var p=new THREE.Mesh(new THREE.BoxGeometry(0.2,0.2,0.2),new THREE.MeshBasicMaterial({color:0xef4444}));p.visible=false;scene.add(p);particles.push({m:p,vx:0,vy:0,vz:0,life:0});}

    // input binding
    function bindHold(id,key){var el=document.getElementById(id);function on(e){e.preventDefault();input[key]=true;el.classList.add('pressed');}function off(e){e.preventDefault();input[key]=false;el.classList.remove('pressed');}el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);el.addEventListener('pointerleave',off);el.addEventListener('pointercancel',off);}
    bindHold('btnLeft','left');bindHold('btnRight','right');bindHold('btnBrake','brake');bindHold('btnGo','accel');

    window.addEventListener('keydown',function(e){if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].indexOf(e.key)>=0)e.preventDefault();if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')input.left=true;if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')input.right=true;if(e.key==='ArrowUp'||e.key==='w'||e.key==='W'||e.key===' ')input.accel=true;if(e.key==='ArrowDown'||e.key==='s'||e.key==='S')input.brake=true;if((state!=='playing')&&(e.key==='Enter'||e.key===' '||e.key==='ArrowUp'))startGame();});
    window.addEventListener('keyup',function(e){if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')input.left=false;if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')input.right=false;if(e.key==='ArrowUp'||e.key==='w'||e.key==='W'||e.key===' ')input.accel=false;if(e.key==='ArrowDown'||e.key==='s'||e.key==='S')input.brake=false;});

    document.getElementById('startBtn').addEventListener('click',function(e){e.stopPropagation();startGame();});
    document.getElementById('restartBtn').addEventListener('click',function(e){e.stopPropagation();startGame();});

    window.addEventListener('resize',sizeIt);
    sizeIt();
    last=performance.now();
    requestAnimationFrame(loop);
  }

  function startGame(){
    state='playing';speed=16;dist=0;level=1;carX=0;steer=0;spawnTimer=0.6;shake=0;
    obstacles.forEach(function(o){o.active=false;o.g.visible=false;});
    finishLineMesh.visible=false;
    overlay.style.display='none';
  }

  function crash(){
    if(state!=='playing')return;
    state='over';shake=0.6;
    for(var i=0;i<particles.length;i++){var p=particles[i];p.life=rand(0.5,1.2);p.vx=rand(-4,4);p.vy=rand(2,6);p.vz=rand(-3,3);p.m.position.set(carX+rand(-0.4,0.4),rand(0.4,1.0),rand(-0.8,0.8));p.m.visible=true;}
    var score=Math.round(dist)+level*100;
    if(score>best){best=score;try{localStorage.setItem('turbo3d_best_shorts',String(best));}catch(e){}}
    setTimeout(function(){
      document.getElementById('finalDist').textContent=Math.round(dist)+' m';
      document.getElementById('finalLevel').textContent=level;
      document.getElementById('bestScore').textContent=best;
      readyPanel.style.display='none';overPanel.style.display='block';
      overlay.style.display='flex';
    },700);
  }

  function spawnWave(){
    var lanes=[-2.6, 0, 2.6];
    shuffle(lanes);
    // Difficulty progression based on level
    var count=level>=3?2:(Math.random()<.5?2:1);
    for(var i=0;i<count;i++){
      var lane=lanes[i];
      var type=Math.random()<(0.6-level*0.05)?'cone':'car';
      var found=null;
      for(var j=0;j<obstacles.length;j++){if(!obstacles[j].active&&obstacles[j].type===type){found=obstacles[j];break;}}
      if(!found){for(var j=0;j<obstacles.length;j++){if(!obstacles[j].active){found=obstacles[j];break;}}}
      if(found){
        found.active=true;found.g.visible=true;found.x=lane;found.g.position.set(lane,0,-160);
        // Traffic speed offset based on difficulty level
        found.own=type==='car'?(0.35+Math.min(0.35,level*0.05)):0;
      }
    }
  }

  var last=0;
  function loop(now){
    requestAnimationFrame(loop);
    var dt=Math.min(0.05,(now-last)/1000);last=now;clock+=dt;
    var worldSpeed=state==='playing'?speed:(state==='ready'?12:Math.max(0,speed));

    if(state==='playing'){
      // Level calculation based on distance (Every 300m level increases, getting faster & harder)
      level=Math.floor(dist/300)+1;
      var maxSpeed=50+level*8+Math.min(25,dist*0.01);
      var target=input.brake?0:(input.accel?maxSpeed:16);
      var rate=input.brake?35:(input.accel&&speed<target?22:8);
      var diff=target-speed;
      speed+=Math.max(-rate*dt,Math.min(rate*dt,diff));
      if(speed<0)speed=0;

      var s=(input.right?1:0)-(input.left?1:0);
      steer+=(s-steer)*Math.min(1,dt*9);
      carX+=steer*8.5*dt;
      if(carX<-3.6)carX=-3.6;if(carX>3.6)carX=3.6;
      dist+=speed*dt;

      spawnTimer-=dt;
      var spawnInterval=Math.max(0.35, 0.75 - (level*0.06));
      if(spawnTimer<=0){spawnWave();spawnTimer=rand(spawnInterval*0.8,spawnInterval*1.3);}

      // Finish line appearance check (Every 500m milestone)
      if(Math.floor(dist)%500<10&&!finishLineMesh.visible){
        finishLineMesh.visible=true;
        finishLineMesh.position.z=-160;
      }
    } else if(state==='over'){
      speed+=(0-speed)*Math.min(1,dt*3);
    }

    // scroll textures
    var dScroll=worldSpeed*dt/10;
    if(roadTex){roadTex.offset.y=(roadTex.offset.y+dScroll)%1;}
    if(grassTex){grassTex.offset.y=(grassTex.offset.y+dScroll)%1;}

    // trees movement
    for(var i=0;i<trees.length;i++){var t=trees[i];t.m.position.z+=worldSpeed*dt;if(t.m.position.z>15){t.m.position.z-=195;t.m.position.x=t.side?rand(-15,-7):rand(7,15);}}

    // finish line movement
    if(finishLineMesh.visible){
      finishLineMesh.position.z+=worldSpeed*dt;
      if(finishLineMesh.position.z>15)finishLineMesh.visible=false;
    }

    // obstacles update & collision check
    for(var i=0;i<obstacles.length;i++){
      var o=obstacles[i];if(!o.active)continue;
      o.g.position.z+=worldSpeed*(1-o.own)*dt;
      if(o.g.position.z>12){o.active=false;o.g.visible=false;continue;}
      if(state==='playing'&&Math.abs(o.g.position.z)<1.9&&Math.abs(o.x-carX)<(0.8+o.halfW)){crash();}
    }

    // particles
    for(var i=0;i<particles.length;i++){var p=particles[i];if(p.life<=0)continue;p.life-=dt;p.vy-=9*dt;p.m.position.x+=p.vx*dt;p.m.position.y+=p.vy*dt;p.m.position.z+=p.vz*dt;p.m.rotation.x+=dt*6;if(p.life<=0||p.m.position.y<0)p.m.visible=false;}

    // car render
    car.position.x=carX;
    car.rotation.z=-steer*0.25;
    car.position.y=Math.sin(clock*14)*0.015*(worldSpeed/40);
    for(var i=0;i<wheels.length;i++)wheels[i].rotation.y+=worldSpeed*dt/0.32;

    // camera shake & dynamic fov
    var fov=58+(worldSpeed/80)*8;
    if(Math.abs(fov-cam.fov)>0.3){cam.fov=fov;cam.updateProjectionMatrix();}
    var shx=0,shy=0;
    if(shake>0){shake-=dt;shx=rand(-1,1)*shake*0.4;shy=rand(-1,1)*shake*0.2;}
    cam.position.set(carX*0.3+shx,3.8+Math.sin(clock*2.5)*0.04*(worldSpeed/50)+shy,7.5);
    cam.lookAt(carX*0.5,1.2,-7);

    // HUD Update
    speedVal.textContent=Math.round(worldSpeed*2.2);
    distVal.textContent=Math.round(dist);
    levelVal.textContent=level;

    rdr.render(scene,cam);
  }

  init();
})();
</script>
</html>
