<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Highway Runner</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:Arial, sans-serif; background:#0b1622; overflow:hidden; }
#gameWrap { position:relative; max-width:540px; margin:0 auto; width:100%; height:90vh; border-radius:18px; box-shadow:0 20px 60px rgba(0,0,0,.5); background:#0b1622; }
#canvasHost { width:100%; height:calc(100% - 100px); }
.ctl-btn { transition:transform .1s; }
.ctl-btn:active { transform:scale(.9); }
#hud { position:absolute; top:15px; right:15px; z-index:10; }
.hud-box { background:rgba(10,25,40,.7); border:1px solid rgba(255,255,255,.15); border-radius:12px; padding:8px 14px; color:#fff; text-align:right; margin-bottom:8px; min-width:100px; }
.hud-label { font-size:11px; color:#94a3b8; }
.hud-value { font-size:22px; font-weight:bold; }
.km { color:#7dd3fc; }
.level { color:#ffd54f; }
#overlay { position:absolute; inset:0; z-index:20; display:flex; align-items:center; justify-content:center; background:rgba(5,15,28,.75); }
.panel { text-align:center; color:#fff; padding:30px; max-width:340px; }
.panel h1 { font-size:26px; margin-bottom:10px; }
.panel p { color:#94a3b8; margin-bottom:20px; font-size:14px; line-height:1.6; }
.btn { padding:14px 40px; font-size:18px; font-weight:bold; border-radius:30px; border:none; cursor:pointer; }
.btn-green { background:linear-gradient(135deg,#22c55e,#16a34a); color:#fff; }
.btn-blue { background:linear-gradient(135deg,#0ea5e9,#2563eb); color:#fff; }
.btn-orange { background:linear-gradient(135deg,#f59e0b,#d97706); color:#fff; }
#controls { position:absolute; bottom:0; left:0; right:0; height:100px; background:linear-gradient(180deg,#0d1b2a,#0a1420); display:flex; align-items:center; justify-content:space-around; border-top:1px solid rgba(255,255,255,.1); }
.ctrl { width:64px; height:64px; border-radius:50%; border:none; font-size:20px; font-weight:bold; cursor:pointer; }
.left, .right { background:#1e3a5f; color:#fff; }
.brake { background:linear-gradient(135deg,#ef4444,#b91c1c); color:#fff; width:68px; height:68px; }
.go { background:linear-gradient(135deg,#22c55e,#15803d); color:#fff; width:78px; height:78px; font-size:22px; }
.hidden { display:none !important; }
</style>
</head>
<body>

<div id="gameWrap">
  <div id="canvasHost"></div>
  
  <div id="hud">
    <div class="hud-box">
      <div class="hud-label">KM</div>
      <div class="hud-value km" id="kmVal">0.00</div>
    </div>
    <div class="hud-box">
      <div class="hud-label">LEVEL</div>
      <div class="hud-value level" id="levelVal">1</div>
    </div>
  </div>

  <div id="overlay">
    <div id="startPanel" class="panel">
      <h1>🚗 3D Highway Runner</h1>
      <p>Steer: ◀ ▶ Buttons or ← → Keys<br>
      Accelerate: GO or ↑ / Space<br>
      Brake: Red Button or ↓<br>
      Reach the finish line & level up!</p>
      <button class="btn btn-green" id="startBtn">START GAME</button>
    </div>
    <div id="crashPanel" class="panel hidden">
      <h1>💥 CRASHED!</h1>
      <p>Distance: <span id="finalKm">0.00</span> km<br>
      Level Reached: <span id="finalLevel">1</span><br>
      Best Score: <span id="bestScore">0</span></p>
      <button class="btn btn-blue" id="restartBtn">PLAY AGAIN</button>
    </div>
    <div id="levelPanel" class="panel hidden">
      <h1>🏁 FINISH LINE!</h1>
      <p>Level <span id="nextLevelNum">2</span> Unlocked!<br>
      More obstacles & sharper curves ahead</p>
      <button class="btn btn-orange" id="nextLevelBtn">NEXT LEVEL</button>
    </div>
  </div>

  <div id="controls">
    <button class="ctrl left" id="btnLeft">◀</button>
    <button class="ctrl right" id="btnRight">▶</button>
    <button class="ctrl brake" id="btnBrake">▼</button>
    <button class="ctrl go" id="btnGo">GO</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const wrap = document.getElementById('gameWrap');
const host = document.getElementById('canvasHost');
const kmVal = document.getElementById('kmVal');
const levelVal = document.getElementById('levelVal');
const overlay = document.getElementById('overlay');
const startPanel = document.getElementById('startPanel');
const crashPanel = document.getElementById('crashPanel');
const levelPanel = document.getElementById('levelPanel');

let scene, camera, renderer, car;
let state = 'ready';
let speed = 15;
let km = 0;
let level = 1;
let best = 0;
let carX = 0;
let steer = 0;
let clock = 0;
let lastTime = 0;
let obstacles = [];
let roadSegments = [];
let girls = [];
let finishLine = null;
let levelDistance = 1.5; // km per level
let levelStartKm = 0;
let input = { left: false, right: false, accel: false, brake: false };

try { best = parseInt(localStorage.getItem('highway_best') || '0'); } catch(e) {}

function random(a, b) { return a + Math.random() * (b - a); }

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87ceeb);
  scene.fog = new THREE.Fog(0x87ceeb, 30, 180);

  camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 500);
  camera.position.set(0, 4.2, 8.5);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(host.clientWidth, host.clientHeight);
  renderer.shadowMap.enabled = true;
  host.appendChild(renderer.domElement);

  // Lights
  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const sun = new THREE.DirectionalLight(0xfff9e8, 1.0);
  sun.position.set(20, 35, 10);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  scene.add(sun);

  // Ground
  const groundGeo = new THREE.PlaneGeometry(300, 600);
  const groundMat = new THREE.MeshLambertMaterial({ color: 0x5aa83f });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.position.z = -150;
  ground.receiveShadow = true;
  scene.add(ground);

  // Create Road
  buildRoad();
  
  // Create Player Car
  createCar();
  
  // Create Finish Line
  createFinishLine();
  
  // Create Dance Girls
  createDanceGirls();

  // Input Events
  setupControls();

  // Start Loop
  lastTime = performance.now();
  requestAnimationFrame(gameLoop);
}

function buildRoad() {
  const roadMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
  const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  
  for(let i = 0; i < 60; i++) {
    const seg = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), roadMat);
    seg.rotation.x = -Math.PI / 2;
    seg.position.z = -i * 10 - 5;
    seg.receiveShadow = true;
    scene.add(seg);
    roadSegments.push(seg);
    
    // Lane markers
    if(i % 2 === 0) {
      const line = new THREE.Mesh(new THREE.PlaneGeometry(0.25, 2), lineMat);
      line.rotation.x = -Math.PI / 2;
      line.position.set(-1.65, 0.01, -i * 10);
      scene.add(line);
      roadSegments.push(line);
      
      const line2 = line.clone();
      line2.position.x = 1.65;
      scene.add(line2);
      roadSegments.push(line2);
    }
  }
}

function createCar() {
  car = new THREE.Group();
  
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(1.7, 0.6, 3.2),
    new THREE.MeshLambertMaterial({ color: 0x1565c0 })
  );
  body.position.y = 0.55;
  body.castShadow = true;
  car.add(body);
  
  const cabin = new THREE.Mesh(
    new THREE.BoxGeometry(1.4, 0.5, 1.4),
    new THREE.MeshLambertMaterial({ color: 0x1a1a1a })
  );
  cabin.position.set(0, 1.05, 0.1);
  car.add(cabin);
  
  const wheelMat = new THREE.MeshLambertMaterial({ color: 0x222222 });
  const wheelPos = [[-0.9, 0.35, -1.05], [0.9, 0.35, -1.05], [-0.9, 0.35, 1.05], [0.9, 0.35, 1.05]];
  wheelPos.forEach(p => {
    const w = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.22, 12), wheelMat);
    w.rotation.z = Math.PI / 2;
    w.position.set(p[0], p[1], p[2]);
    car.add(w);
  });
  
  car.position.y = 0;
  scene.add(car);
}

function createFinishLine() {
  const poleMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
  const flagMat = new THREE.MeshBasicMaterial({ color: 0xff4444, side: THREE.DoubleSide });
  
  finishLine = new THREE.Group();
  
  const leftPole = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 5), poleMat);
  leftPole.position.set(-6, 2.5, 0);
  finishLine.add(leftPole);
  
  const rightPole = leftPole.clone();
  rightPole.position.x = 6;
  finishLine.add(rightPole);
  
  const flag = new THREE.Mesh(new THREE.PlaneGeometry(10, 1.8), flagMat);
  flag.position.set(0, 3.8, 0);
  finishLine.add(flag);
  
  finishLine.visible = false;
  scene.add(finishLine);
}

function createDanceGirls() {
  const skinMat = new THREE.MeshLambertMaterial({ color: 0xffdbac });
  const dressColors = [0xff69b4, 0x9932cc, 0xff4500, 0x00ced1, 0xffd700];
  
  for(let i = 0; i < 8; i++) {
    const girl = new THREE.Group();
    
    // Body
    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.3, 1.0), skinMat);
    body.position.y = 0.8;
    girl.add(body);
    
    // Dress
    const dress = new THREE.Mesh(
      new THREE.ConeGeometry(0.6, 1.1, 8),
      new THREE.MeshLambertMaterial({ color: dressColors[i % dressColors.length] })
    );
    dress.position.y = 0.45;
    girl.add(dress);
    
    // Head
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.28), skinMat);
    head.position.y = 1.6;
    girl.add(head);
    
    // Hair
    const hair = new THREE.Mesh(
      new THREE.SphereGeometry(0.32),
      new THREE.MeshLambertMaterial({ color: 0x3c2a21 })
    );
    hair.scale.set(1, 0.9, 0.8);
    hair.position.set(0, 1.6, -0.15);
    girl.add(hair);
    
    // Position
    const side = i % 2 === 0 ? -1 : 1;
    girl.position.set(side * random(7, 14), 0, -random(40, 150));
    girl.userData = { baseY: 0, phase: random(0, Math.PI * 2), side: side };
    
    scene.add(girl);
    girls.push(girl);
  }
}

function spawnObstacle() {
  const types = ['cone', 'barrier', 'car'];
  const type = types[Math.floor(random(0, types.length))];
  const lanes = [-3.3, 0, 3.3];
  const lane = lanes[Math.floor(random(0, lanes.length))];
  
  let obstacle;
  const mat = new THREE.MeshLambertMaterial({ color: type === 'cone' ? 0xff6600 : type === 'barrier' ? 0xffcc00 : 0xe53935 });
  
  if(type === 'cone') {
    obstacle = new THREE.Mesh(new THREE.ConeGeometry(0.35, 0.9), mat);
    obstacle.position.y = 0.45;
  } else if(type === 'barrier') {
    obstacle = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.6, 0.4), mat);
    obstacle.position.y = 0.3;
  } else {
    obstacle = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.5, 2.8), mat);
    obstacle.position.y = 0.55;
  }
  
  obstacle.position.x = lane;
  obstacle.position.z = -160;
  obstacle.castShadow = true;
  obstacle.userData = { type: type, lane: lane, halfW: type === 'barrier' ? 1.2 : 0.5 };
  
  scene.add(obstacle);
  obstacles.push(obstacle);
}

function setupControls() {
  // Buttons
  document.getElementById('btnLeft').addEventListener('touchstart', e => { e.preventDefault(); input.left = true; });
  document.getElementById('btnLeft').addEventListener('touchend', () => input.left = false);
  document.getElementById('btnRight').addEventListener('touchstart', e => { e.preventDefault(); input.right = true; });
  document.getElementById('btnRight').addEventListener('touchend', () => input.right = false);
  document.getElementById('btnBrake').addEventListener('touchstart', e => { e.preventDefault(); input.brake = true; });
  document.getElementById('btnBrake').addEventListener('touchend', () => input.brake = false);
  document.getElementById('btnGo').addEventListener('touchstart', e => { e.preventDefault(); input.accel = true; });
  document.getElementById('btnGo').addEventListener('touchend', () => input.accel = false);
  
  // Mouse
  document.getElementById('btnLeft').addEventListener('mousedown', () => input.left = true);
  document.getElementById('btnLeft').addEventListener('mouseup', () => input.left = false);
  document.getElementById('btnRight').addEventListener('mousedown', () => input.right = true);
  document.getElementById('btnRight').addEventListener('mouseup', () => input.right = false);
  document.getElementById('btnBrake').addEventListener('mousedown', () => input.brake = true);
  document.getElementById('btnBrake').addEventListener('mouseup', () => input.brake = false);
  document.getElementById('btnGo').addEventListener('mousedown', () => input.accel = true);
  document.getElementById('btnGo').addEventListener('mouseup', () => input.accel = false);
  
  // Keyboard
  window.addEventListener('keydown', e => {
    if(e.key === 'ArrowLeft') input.left = true;
    if(e.key === 'ArrowRight') input.right = true;
    if(e.key === 'ArrowUp' || e.key === ' ') input.accel = true;
    if(e.key === 'ArrowDown') input.brake = true;
    if(e.key === 'Enter' && state !== 'playing') startGame();
  });
  window.addEventListener('keyup', e => {
    if(e.key === 'ArrowLeft') input.left = false;
    if(e.key === 'ArrowRight') input.right = false;
    if(e.key === 'ArrowUp' || e.key === ' ') input.accel = false;
    if(e.key === 'ArrowDown') input.brake = false;
  });
  
  // Game buttons
  document.getElementById('startBtn').onclick = startGame;
  document.getElementById('restartBtn').onclick = startGame;
  document.getElementById('nextLevelBtn').onclick = nextLevel;
}

function startGame() {
  state = 'playing';
  speed = 15;
  km = 0;
  level = 1;
  levelStartKm = 0;
  carX = 0;
  steer = 0;
  obstacles.forEach(o => scene.remove(o));
  obstacles = [];
  finishLine.visible = false;
  startPanel.classList.add('hidden');
  crashPanel.classList.add('hidden');
  levelPanel.classList.add('hidden');
  overlay.style.display = 'none';
  updateHUD();
}

function nextLevel() {
  level++;
  levelStartKm = km;
  speed = Math.min(45, 15 + level * 3);
  obstacles.forEach(o => scene.remove(o));
  obstacles = [];
  finishLine.visible = false;
  levelPanel.classList.add('hidden');
  overlay.style.display = 'none';
  state = 'playing';
  updateHUD();
}

function gameOver() {
  state = 'crashed';
  const score = Math.round(km * 1000) + level * 500;
  if(score > best) {
    best = score;
    try { localStorage.setItem('highway_best', String(best)); } catch(e) {}
  }
  document.getElementById('finalKm').textContent = km.toFixed(2);
  document.getElementById('finalLevel').textContent = level;
  document.getElementById('bestScore').textContent = best;
  setTimeout(() => {
    overlay.style.display = 'flex';
    crashPanel.classList.remove('hidden');
  }, 500);
}

function levelComplete() {
  state = 'levelup';
  document.getElementById('nextLevelNum').textContent = level + 1;
  setTimeout(() => {
    overlay.style.display = 'flex';
    levelPanel.classList.remove('hidden');
  }, 600);
}

function updateHUD() {
  kmVal.textContent = km
