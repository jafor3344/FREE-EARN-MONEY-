<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Juice Glass Runner 3D</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js for 3D Graphics -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            touch-action: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        .glass-hud {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 2px solid rgba(255, 255, 255, 0.6);
        }
    </style>
</head>
<body class="bg-sky-300 overflow-hidden">

    <!-- 3D Canvas -->
    <div id="canvas-container"></div>

    <!-- UI Overlay (Minimal Top HUD - Level & Score Only in Corners) -->
    <div id="hud" class="fixed top-0 left-0 w-full p-3 flex justify-between items-start pointer-events-none z-10">
        
        <!-- Top Left: Compact Level Badge -->
        <div class="glass-hud rounded-full px-4 py-2 flex items-center gap-2 shadow-lg pointer-events-auto">
            <div id="level-badge" class="px-2.5 py-1 rounded-full bg-amber-400 font-black text-amber-950 text-xs shadow flex items-center gap-1">
                <span>LVL</span> <span id="current-level-num">1</span>
            </div>
            <div class="w-20 bg-white/50 rounded-full h-3 overflow-hidden p-0.5 border border-white/60">
                <div id="progress-bar" class="bg-gradient-to-r from-orange-400 to-amber-500 h-full w-0 rounded-full transition-all duration-100"></div>
            </div>
        </div>

        <!-- Top Right: Compact Score Only -->
        <div class="glass-hud rounded-2xl px-4 py-1.5 shadow-md text-right pointer-events-auto">
            <div class="text-[9px] font-black text-sky-950 uppercase tracking-wider">Score</div>
            <div id="score-text" class="text-xl font-black text-emerald-950">0</div>
        </div>
    </div>

    <!-- Hidden State Overlay (Only Buttons appear at bottom after Dance finishes) -->
    <div id="game-over-screen" class="fixed inset-0 bg-transparent flex flex-col items-center justify-end z-30 hidden pb-12 pointer-events-none">
        <div id="button-container" class="flex flex-col gap-2 pointer-events-auto max-w-xs w-full px-6">
            <button id="next-level-btn" class="hidden w-full py-3.5 bg-emerald-500 hover:bg-emerald-400 text-white font-black text-lg rounded-2xl shadow-xl transform active:scale-95 transition flex items-center justify-center gap-2 border-b-4 border-emerald-700">
                পরবর্তী লেভেল <i class="fa-solid fa-arrow-right"></i>
            </button>
            <button id="restart-btn" class="w-full py-3.5 bg-amber-400 hover:bg-amber-300 text-amber-950 font-black text-lg rounded-2xl shadow-xl transform active:scale-95 transition flex items-center justify-center gap-2 border-b-4 border-amber-600">
                <i class="fa-solid fa-rotate-right"></i> আবার খেলুন
            </button>
        </div>
    </div>

    <!-- Main Logic -->
    <script>
        // Audio Synthesizer
        const AudioFX = {
            ctx: null,
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            },
            playHop() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(220, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(440, this.ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.08);
            },
            playCollect() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, this.ctx.currentTime);
                osc.frequency.setValueAtTime(659.25, this.ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.2);
            },
            playColorGate() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.15);
            },
            playHit() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(160, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.2);
            },
            playWin() {
                if (!this.ctx) return;
                const notes = [440, 554.37, 659.25, 880, 1046.50];
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.1);
                    gain.gain.setValueAtTime(0.2, this.ctx.currentTime + idx * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + idx * 0.1 + 0.3);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(this.ctx.currentTime + idx * 0.1);
                    osc.stop(this.ctx.currentTime + idx * 0.1 + 0.3);
                });
            }
        };

        // --- Color Palettes System ---
        const JUICE_COLORS = [
            { id: 'green', name: 'Green Juice', hex: 0x84cc16, css: '#84cc16' },
            { id: 'red', name: 'Red Juice', hex: 0xef4444, css: '#ef4444' },
            { id: 'yellow', name: 'Yellow Juice', hex: 0xeab308, css: '#eab308' },
            { id: 'blue', name: 'Blue Juice', hex: 0x3b82f6, css: '#3b82f6' },
            { id: 'purple', name: 'Purple Juice', hex: 0xa855f7, css: '#a855f7' }
        ];

        let currentJuiceColor = JUICE_COLORS[0];

        // --- 3D Scene Variables ---
        let scene, camera, renderer;
        let playerGroup, glassMesh, juiceLevelMesh;
        let giantGirlGroup, girlHead, girlBody, girlArmL, girlArmR, girlLegL, girlLegR;
        let trackLength = 250;
        let isPlaying = false;
        let isVictorious = false;
        let danceDurationTimer = 0; // Extended Dance duration controller

        let currentLevel = 1;
        let score = 0;
        let juiceVolume = 100;
        let playerPos = { x: 0, z: 0 };
        let targetX = 0;

        let forwardSpeed = 0.14;
        const laneLimit = 2.6;

        let hopTime = 0;
        let hopFrequency = 6.5;
        const hopHeight = 0.7;
        let giantGirlJumpTime = 0;

        let colorGates = [];
        let collectibles = [];
        let obstacles = [];
        let palmTrees = [];
        let particles = [];

        let isDragging = false;
        let prevTouchX = 0;
        let keys = { ArrowLeft: false, ArrowRight: false, a: false, d: false };

        // --- Initialization ---
        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x60a5fa);
            scene.fog = new THREE.FogExp2(0x60a5fa, 0.007);

            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 300);
            camera.position.set(0, 5, -8);
            camera.lookAt(0, 1.5, 5);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            const ambient = new THREE.AmbientLight(0xffffff, 0.75);
            scene.add(ambient);

            const sunLight = new THREE.DirectionalLight(0xffffff, 0.9);
            sunLight.position.set(15, 30, -10);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 1024;
            sunLight.shadow.mapSize.height = 1024;
            scene.add(sunLight);

            createJuiceGlassPlayer();
            setupInput();
            startLevel(1);

            window.addEventListener('resize', onWindowResize);
            animate(0);
        }

        // --- Build Level World & Environment ---
        function buildLevelWorld(level) {
            colorGates.forEach(g => scene.remove(g));
            collectibles.forEach(c => scene.remove(c));
            obstacles.forEach(o => scene.remove(o));
            palmTrees.forEach(t => scene.remove(t));
            colorGates = [];
            collectibles = [];
            obstacles = [];
            palmTrees = [];

            if (giantGirlGroup) scene.remove(giantGirlGroup);

            if (level === 1) {
                forwardSpeed = 0.14;
                trackLength = 220;
            } else if (level === 2) {
                forwardSpeed = 0.18;
                trackLength = 280;
            } else {
                forwardSpeed = 0.22;
                trackLength = 340;
            }

            const existingTrack = scene.getObjectByName("track");
            if (existingTrack) scene.remove(existingTrack);

            const trackGeo = new THREE.PlaneGeometry(6.5, trackLength);
            const trackMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 });
            const track = new THREE.Mesh(trackGeo, trackMat);
            track.name = "track";
            track.rotation.x = -Math.PI / 2;
            track.position.set(0, 0, trackLength / 2 - 5);
            track.receiveShadow = true;
            scene.add(track);

            // Add 3D Palm Trees along the sides of the track
            for (let z = 10; z < trackLength; z += 18) {
                spawnPalmTree(-4.8, z);
                spawnPalmTree(4.8, z);
            }

            const finishZ = trackLength - 15;
            const archGeo = new THREE.TorusGeometry(3.6, 0.3, 12, 24, Math.PI);
            const archMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b, roughness: 0.2 });
            const arch = new THREE.Mesh(archGeo, archMat);
            arch.position.set(0, 0, finishZ);
            scene.add(arch);

            createGiantGirlCharacter(finishZ + 6);

            let colorIndex = 0;
            for (let z = 25; z < finishZ - 20; z += 22) {
                const gateColor = JUICE_COLORS[(colorIndex++) % JUICE_COLORS.length];
                spawnColorGate(z, gateColor);
                spawnGlassCluster(z + 8, gateColor);

                if (level >= 2 && Math.random() > 0.3) {
                    spawnMovingObstacle(z + 15, level);
                } else {
                    spawnStaticSpike(z + 15);
                }
            }
        }

        // --- 3D Palm Tree Builder ---
        function spawnPalmTree(x, z) {
            const treeGroup = new THREE.Group();
            treeGroup.position.set(x, 0, z);

            // Trunk
            const trunkGeo = new THREE.CylinderGeometry(0.2, 0.35, 5, 8);
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.9 });
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.y = 2.5;
            trunk.castShadow = true;
            treeGroup.add(trunk);

            // Leaves
            const leafMat = new THREE.MeshStandardMaterial({ color: 0x15803d, roughness: 0.5 });
            for (let i = 0; i < 5; i++) {
                const leafGeo = new THREE.ConeGeometry(1.4, 0.3, 4);
                const leaf = new THREE.Mesh(leafGeo, leafMat);
                leaf.position.set(0, 5, 0);
                leaf.rotation.y = (i * 72 * Math.PI) / 180;
                leaf.rotation.z = 0.4;
                treeGroup.add(leaf);
            }

            scene.add(treeGroup);
            palmTrees.push(treeGroup);
        }

        // --- 3D Giant Girl Character at Finish Line ---
        function createGiantGirlCharacter(zPos) {
            giantGirlGroup = new THREE.Group();
            giantGirlGroup.position.set(0, 0, zPos);
            giantGirlGroup.scale.set(2.2, 2.2, 2.2);

            const dressGeo = new THREE.ConeGeometry(0.8, 1.6, 16);
            const dressMat = new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.4 });
            girlBody = new THREE.Mesh(dressGeo, dressMat);
            girlBody.position.y = 1.3;
            girlBody.castShadow = true;
            giantGirlGroup.add(girlBody);

            const headGeo = new THREE.SphereGeometry(0.55, 20, 20);
            const skinMat = new THREE.MeshStandardMaterial({ color: 0xffdbac, roughness: 0.6 });
            girlHead = new THREE.Mesh(headGeo, skinMat);
            girlHead.position.y = 2.4;
            girlHead.castShadow = true;
            giantGirlGroup.add(girlHead);

            const eyeGeo = new THREE.SphereGeometry(0.08, 10, 10);
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
            const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
            eyeL.position.set(-0.18, 2.5, -0.48);
            const eyeR = new THREE.Mesh(eyeGeo, eyeMat);
            eyeR.position.set(0.18, 2.5, -0.48);
            giantGirlGroup.add(eyeL, eyeR);

            const hairGeo = new THREE.SphereGeometry(0.62, 16, 16);
            const hairMat = new THREE.MeshStandardMaterial({ color: 0x5c2c16, roughness: 0.8 });
            const hair = new THREE.Mesh(hairGeo, hairMat);
            hair.position.set(0, 2.55, 0.1);
            giantGirlGroup.add(hair);

            const armGeo = new THREE.CylinderGeometry(0.1, 0.1, 0.9, 10);
            girlArmL = new THREE.Mesh(armGeo, skinMat);
            girlArmL.position.set(-0.75, 1.7, 0);
            girlArmL.rotation.z = Math.PI / 6;

            girlArmR = new THREE.Mesh(armGeo, skinMat);
            girlArmR.position.set(0.75, 1.7, 0);
            girlArmR.rotation.z = -Math.PI / 6;

            giantGirlGroup.add(girlArmL, girlArmR);

            const legGeo = new THREE.CylinderGeometry(0.12, 0.12, 0.8, 10);
            girlLegL = new THREE.Mesh(legGeo, skinMat);
            girlLegL.position.set(-0.35, 0.4, 0);
            girlLegR = new THREE.Mesh(legGeo, skinMat);
            girlLegR.position.set(0.35, 0.4, 0);
            giantGirlGroup.add(girlLegL, girlLegR);

            scene.add(giantGirlGroup);
        }

        function spawnColorGate(zPos, targetColor) {
            const gateGroup = new THREE.Group();
            gateGroup.position.set(0, 0, zPos);

            const ringGeo = new THREE.TorusGeometry(2.4, 0.25, 16, 30);
            const ringMat = new THREE.MeshStandardMaterial({ color: targetColor.hex, emissive: targetColor.hex, emissiveIntensity: 0.4, roughness: 0.2 });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.position.y = 1.6;
            gateGroup.add(ring);

            const particleGeo = new THREE.PlaneGeometry(4.2, 3.2);
            const particleMat = new THREE.MeshBasicMaterial({ color: targetColor.hex, transparent: true, opacity: 0.3, side: THREE.DoubleSide });
            const curtain = new THREE.Mesh(particleGeo, particleMat);
            curtain.position.y = 1.6;
            gateGroup.add(curtain);

            gateGroup.userData = { color: targetColor };
            scene.add(gateGroup);
            colorGates.push(gateGroup);
        }

        function spawnGlassCluster(zPos, currentColorTarget) {
            const positions = [-1.8, 0, 1.8];
            positions.forEach((xPos, idx) => {
                const isMatch = (idx === 1);
                const colorObj = isMatch ? currentColorTarget : JUICE_COLORS[(Math.floor(Math.random() * JUICE_COLORS.length))];

                const cupGroup = new THREE.Group();
                cupGroup.position.set(xPos, 0.9, zPos);

                const cupGeo = new THREE.CylinderGeometry(0.4, 0.26, 0.9, 14);
                const cupMat = new THREE.MeshStandardMaterial({ color: colorObj.hex, roughness: 0.2 });
                const cup = new THREE.Mesh(cupGeo, cupMat);
                cup.castShadow = true;
                cupGroup.add(cup);

                cupGroup.userData = { color: colorObj, isMatching: isMatch };
                scene.add(cupGroup);
                collectibles.push(cupGroup);
            });
        }

        function spawnStaticSpike(zPos) {
            const obstacle = new THREE.Group();
            obstacle.position.set((Math.random() - 0.5) * 3.5, 0.5, zPos);

            const spikeGeo = new THREE.ConeGeometry(0.45, 1.2, 8);
            const spikeMat = new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.4 });
            const spike = new THREE.Mesh(spikeGeo, spikeMat);
            spike.castShadow = true;
            obstacle.add(spike);

            scene.add(obstacle);
            obstacles.push(obstacle);
        }

        function spawnMovingObstacle(zPos, level) {
            const gateGroup = new THREE.Group();
            gateGroup.position.set(0, 0, zPos);

            const boardGeo = new THREE.BoxGeometry(2.4, 1.4, 0.4);
            const boardMat = new THREE.MeshStandardMaterial({ color: 0x7e22ce });
            const board = new THREE.Mesh(boardGeo, boardMat);
            board.position.y = 0.9;
            board.castShadow = true;

            gateGroup.add(board);
            gateGroup.userData = {
                mesh: board,
                initialX: -1.8,
                moveRange: 3.6,
                speed: 1.0 + level * 0.4,
                phase: Math.random() * Math.PI
            };

            scene.add(gateGroup);
            obstacles.push(gateGroup);
        }

        function createJuiceGlassPlayer() {
            playerGroup = new THREE.Group();

            const glassGeo = new THREE.CylinderGeometry(0.7, 0.4, 1.8, 24, 1, true);
            const glassMat = new THREE.MeshPhysicalMaterial({
                color: 0xf8fafc,
                transparent: true,
                opacity: 0.45,
                roughness: 0.1,
                transmission: 0.85,
                thickness: 0.4,
                side: THREE.DoubleSide
            });
            glassMesh = new THREE.Mesh(glassGeo, glassMat);
            glassMesh.position.y = 1.1;
            glassMesh.castShadow = true;
            playerGroup.add(glassMesh);

            const juiceGeo = new THREE.CylinderGeometry(0.66, 0.42, 1.6, 20);
            const juiceMat = new THREE.MeshStandardMaterial({ color: currentJuiceColor.hex, roughness: 0.2 });
            juiceLevelMesh = new THREE.Mesh(juiceGeo, juiceMat);
            glassMesh.add(juiceLevelMesh);

            const faceGroup = new THREE.Group();
            const eyeGeo = new THREE.SphereGeometry(0.12, 10, 10);
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const pupilGeo = new THREE.SphereGeometry(0.06, 10, 10);
            const pupilMat = new THREE.MeshBasicMaterial({ color: 0x000000 });

            const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
            eyeL.position.set(-0.22, 0.2, 0.62);
            const pupilL = new THREE.Mesh(pupilGeo, pupilMat);
            pupilL.position.set(-0.22, 0.2, 0.72);
            faceGroup.add(eyeL, pupilL);

            const eyeR = new THREE.Mesh(eyeGeo, eyeMat);
            eyeR.position.set(0.22, 0.2, 0.62);
            const pupilR = new THREE.Mesh(pupilGeo, pupilMat);
            pupilR.position.set(0.22, 0.2, 0.72);
            faceGroup.add(eyeR, pupilR);

            glassMesh.add(faceGroup);
            scene.add(playerGroup);
        }

        function setupInput() {
            window.addEventListener('keydown', (e) => { if (e.key in keys) keys[e.key] = true; });
            window.addEventListener('keyup', (e) => { if (e.key in keys) keys[e.key] = false; });

            const onPointerDown = (e) => {
                if (!isPlaying) return;
                isDragging = true;
                prevTouchX = e.touches ? e.touches[0].clientX : e.clientX;
                AudioFX.init();
            };

            const onPointerMove = (e) => {
                if (!isDragging || !isPlaying) return;
                const currentX = e.touches ? e.touches[0].clientX : e.clientX;
                const deltaX = currentX - prevTouchX;
                prevTouchX = currentX;

                targetX += deltaX * 0.012;
                targetX = Math.max(-laneLimit, Math.min(laneLimit, targetX));
            };

            const onPointerUp = () => { isDragging = false; };

            window.addEventListener('mousedown', onPointerDown);
            window.addEventListener('mousemove', onPointerMove);
            window.addEventListener('mouseup', onPointerUp);

            window.addEventListener('touchstart', onPointerDown);
            window.addEventListener('touchmove', onPointerMove);
            window.addEventListener('touchend', onPointerUp);

            document.getElementById('restart-btn').addEventListener('click', () => startLevel(currentLevel));
            document.getElementById('next-level-btn').addEventListener('click', () => startLevel(currentLevel + 1));
        }

        function startLevel(levelNum) {
            AudioFX.init();
            currentLevel = Math.min(3, levelNum);
            isPlaying = true;
            isVictorious = false;
            danceDurationTimer = 0;
            juiceVolume = 100;
            playerPos = { x: 0, z: 0 };
            targetX = 0;
            hopTime = 0;

            currentJuiceColor = JUICE_COLORS[0];
            juiceLevelMesh.material.color.setHex(currentJuiceColor.hex);

            buildLevelWorld(currentLevel);

            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('next-level-btn').classList.add('hidden');
            document.getElementById('current-level-num').innerText = currentLevel;

            updateHUD();
        }

        function triggerVictory() {
            isPlaying = false;
            isVictorious = true;
            danceDurationTimer = 0; // Reset dance duration timer
            AudioFX.playWin();
        }

        function triggerGameOver() {
            isPlaying = false;
            AudioFX.playHit();
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('next-level-btn').classList.add('hidden');
        }

        function updateHUD() {
            document.getElementById('score-text').innerText = score;
            const progress = Math.min(100, Math.max(0, (playerPos.z / (trackLength - 15)) * 100));
            document.getElementById('progress-bar').style.width = `${progress}%`;
        }

        function createJuiceSplash(pos, colorHex) {
            for (let i = 0; i < 12; i++) {
                const pGeo = new THREE.SphereGeometry(0.12, 6, 6);
                const pMat = new THREE.MeshBasicMaterial({ color: colorHex });
                const p = new THREE.Mesh(pGeo, pMat);
                p.position.copy(pos);
                p.userData = {
                    velocity: new THREE.Vector3(
                        (Math.random() - 0.5) * 0.5,
                        Math.random() * 0.5 + 0.2,
                        (Math.random() - 0.5) * 0.5
                    ),
                    life: 1.0
                };
                scene.add(p);
                particles.push(p);
            }
        }

        // --- Render Loop ---
        function animate(timestamp) {
            requestAnimationFrame(animate);

            const delta = 0.016;

            if (isPlaying) {
                if (keys.ArrowLeft || keys.a) targetX -= 0.10;
                if (keys.ArrowRight || keys.d) targetX += 0.10;
                targetX = Math.max(-laneLimit, Math.min(laneLimit, targetX));

                playerPos.x += (targetX - playerPos.x) * 0.18;
                playerPos.z += forwardSpeed;

                hopTime += delta * hopFrequency;
                const hopY = Math.abs(Math.sin(hopTime)) * hopHeight;

                if (Math.sin(hopTime) < 0.1 && Math.sin(hopTime - delta * hopFrequency) >= 0.1) {
                    AudioFX.playHop();
                }

                playerGroup.position.set(playerPos.x, hopY, playerPos.z);
                glassMesh.rotation.z = (playerPos.x - targetX) * 0.2;

                camera.position.z = playerPos.z - 7.5;
                camera.position.x = playerPos.x * 0.3;
                camera.position.y = 4.5 + hopY * 0.2;
                camera.lookAt(playerPos.x * 0.3, 1.6, playerPos.z + 5);

                const finishZ = trackLength - 15;
                if (playerPos.z >= finishZ) {
                    triggerVictory();
                }

                colorGates.forEach(gate => {
                    if (gate.visible && Math.abs(playerPos.z - gate.position.z) < 0.8) {
                        gate.visible = false;
                        currentJuiceColor = gate.userData.color;
                        juiceLevelMesh.material.color.setHex(currentJuiceColor.hex);
                        AudioFX.playColorGate();
                        createJuiceSplash(playerGroup.position, gate.userData.color.hex);
                    }
                });

                collectibles.forEach(item => {
                    if (item.visible && Math.abs(playerPos.z - item.position.z) < 0.8 && Math.abs(playerPos.x - item.position.x) < 0.9) {
                        item.visible = false;

                        if (item.userData.color.id === currentJuiceColor.id) {
                            AudioFX.playCollect();
                            score += 20;
                            createJuiceSplash(playerGroup.position, currentJuiceColor.hex);
                        } else {
                            AudioFX.playHit();
                            juiceVolume -= 25;
                            createJuiceSplash(playerGroup.position, 0xef4444);
                            if (juiceVolume <= 0) triggerGameOver();
                        }
                    }
                });

                obstacles.forEach(obs => {
                    if (obs.userData && obs.userData.mesh) {
                        const sweep = Math.sin(timestamp * 0.002 * obs.userData.speed + obs.userData.phase);
                        obs.userData.mesh.position.x = obs.userData.initialX + sweep * obs.userData.moveRange;
                    }

                    const dz = playerPos.z - obs.position.z;
                    const dx = playerPos.x - (obs.userData?.mesh ? obs.position.x + obs.userData.mesh.position.x : obs.position.x);

                    if (Math.abs(dz) < 0.8 && Math.abs(dx) < 1.1) {
                        AudioFX.playHit();
                        juiceVolume -= 30;
                        createJuiceSplash(playerGroup.position, currentJuiceColor.hex);
                        obs.position.z -= 500;
                        if (juiceVolume <= 0) triggerGameOver();
                    }
                });

                updateHUD();
            }

            // Extended Dancing Animation for Giant Girl at Finish Line
            if (isVictorious && giantGirlGroup) {
                danceDurationTimer += delta;
                giantGirlJumpTime += delta * 12;
                
                // Dance Motion (Jump & Sway)
                const jumpY = Math.abs(Math.sin(giantGirlJumpTime)) * 1.6;
                giantGirlGroup.position.y = jumpY;
                giantGirlGroup.rotation.y += 0.04;

                girlArmL.rotation.z = Math.PI / 3 + Math.sin(giantGirlJumpTime) * 0.5;
                girlArmR.rotation.z = -Math.PI / 3 - Math.sin(giantGirlJumpTime) * 0.5;

                if (Math.random() > 0.3) {
                    createJuiceSplash(new THREE.Vector3((Math.random() - 0.5) * 6, 2, trackLength - 10), JUICE_COLORS[Math.floor(Math.random() * JUICE_COLORS.length)].hex);
                }

                // Show buttons AFTER 8 seconds of dancing
                if (danceDurationTimer > 8.0) {
                    document.getElementById('game-over-screen').classList.remove('hidden');
                    if (currentLevel < 3) {
                        document.getElementById('next-level-btn').classList.remove('hidden');
                    }
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.position.add(p.userData.velocity);
                p.userData.life -= 0.04;
                p.scale.multiplyScalar(0.92);
                if (p.userData.life <= 0) {
                    scene.remove(p);
                    particles.splice(i, 1);
                }
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = init;
    </script>
</body>
</html>
